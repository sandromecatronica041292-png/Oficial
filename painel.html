<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy | Monitor Pro Intelligence</title>
<style>
  :root { 
    --bg-dark: #070a13; --card-bg: #101625; --accent: #00d2ff; 
    --text-main: #f0f4f8; --text-muted: #64748b; --on: #00ff88; 
    --off: #f43f5e; --warn: #fbbf24; --glass: rgba(255, 255, 255, 0.03); 
  }
  
  body { 
    margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; 
    background: var(--bg-dark); color: var(--text-main); 
    display: flex; justify-content: center; align-items: center; 
    min-height: 100vh; padding: 15px; overflow-x: hidden;
  }
  
  .card { 
    background: var(--card-bg); border-radius: 28px; padding: 30px; width: 100%; 
    max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); 
    border: 1px solid rgba(255,255,255,0.08); text-align: center; 
    position: relative; backdrop-filter: blur(10px);
  }

  /* BARRA DE TOPO: Wi-Fi e Logout alinhados */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  #wifiIcon { cursor: pointer; transition: 0.3s; opacity: 0.7; display: flex; align-items: center; }
  #wifiIcon:hover { opacity: 1; transform: scale(1.1); }

  .btn-logout { 
    background: rgba(244, 63, 94, 0.1); 
    border: 1px solid rgba(244, 63, 94, 0.2); color: var(--off); 
    padding: 6px 12px; border-radius: 10px; font-size: 10px; cursor: pointer; font-weight: 700;
    text-transform: uppercase;
  }
  .btn-logout:hover { background: rgba(244, 63, 94, 0.2); }

  .header-main { position: relative; margin-bottom: 30px; }
  .logo-principal { 
    font-size: 20px; text-transform: uppercase; letter-spacing: 5px; font-weight: 900; 
    background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    cursor: pointer; transition: 0.3s;
  }

  .status-badge { 
    display: inline-flex; align-items: center; gap: 8px; 
    padding: 8px 20px; border-radius: 50px; font-size: 11px; 
    font-weight: 800; letter-spacing: 1px; border: 1px solid rgba(255,255,255,0.05); 
  }
  
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .st-online .dot { background: var(--on); box-shadow: 0 0 10px var(--on); animation: pulse 1.5s infinite; }
  .st-online { color: var(--on); background: rgba(0, 255, 136, 0.05); }
  .st-offline { color: var(--off); background: rgba(244, 63, 94, 0.05); }
  .st-offline .dot { background: var(--off); }
  
  @keyframes pulse {
    0% { transform: scale(0.95); }
    70% { transform: scale(1); }
    100% { transform: scale(0.95); }
  }

  .gauges-container { display: flex; gap: 15px; margin-bottom: 30px; }
  .gauge-box { 
    flex: 1; background: rgba(255,255,255,0.02); padding: 20px 10px; 
    border-radius: 22px; border: 1px solid rgba(255,255,255,0.05); 
    display: flex; flex-direction: column; align-items: center;
  }
  .gauge-box canvas { width: 140px !important; height: 85px !important; }
  .g-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
  .g-value { font-size: 22px; font-weight: 900; }

  .btn-action { 
    width: 100%; padding: 18px; border: none; border-radius: 16px; 
    font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.3s; 
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
  }
  .btn-led.on { background: var(--on); color: #052e16; box-shadow: 0 10px 20px -5px rgba(0, 255, 136, 0.3); }
  .btn-led.off { background: #1e293b; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }
  .btn-history { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  #adminPanel { 
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    background: #0f172a; border-radius: 28px; padding: 30px; box-sizing: border-box; 
    z-index: 100; flex-direction: column; overflow-y: auto; text-align: left;
  }
  .admin-input { 
    background: #070a13; border: 1px solid #334155; color: white; 
    padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 15px; outline: none;
  }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
</head>

<body>
<div class="card">
  <div class="top-bar">
    <div id="wifiIcon" onclick="menuRedeOculto()" title="Redefinir Wi-Fi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" id="wifiSvg" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
            <circle cx="12" cy="20" r="2" fill="currentColor"></circle>
        </svg>
    </div>
    <button class="btn-logout" onclick="fazerLogout()">Logout</button>
  </div>

  <div id="adminPanel">
    <div class="logo-principal" style="font-size: 14px; margin-bottom: 25px;">Configurações Avançadas</div>
    <label style="font-size: 10px; color: gray;">E-MAIL DE ALERTA</label>
    <input type="email" id="cfgEmail" class="admin-input" placeholder="seu@email.com">
    <button class="btn-action" style="background:var(--accent); color:#000;" onclick="salvarConfig()">Salvar e Sair</button>
    <button class="btn-action" style="background:transparent; color:gray" onclick="fecharAdmin()">Cancelar</button>
  </div>

  <div class="header-main">
    <div class="logo-principal" id="logoAdmin">NewEnergy</div>
  </div>
  
  <div class="status-container">
    <div id="status" class="status-badge st-online">
      <div class="dot"></div> <span>SINCRONIZANDO</span>
    </div>
  </div>

  <div class="gauges-container">
    <div class="gauge-box">
      <div class="g-title">Temperatura</div>
      <canvas id="gTemp"></canvas>
      <div id="tempVal" class="g-value" style="color:var(--off)">--°C</div>
    </div>
    <div class="gauge-box">
      <div class="g-title">Umidade</div>
      <canvas id="gHum"></canvas>
      <div id="humVal" class="g-value" style="color:var(--accent)">--%</div>
    </div>
  </div>

  <button id="btnLED" class="btn-action btn-led off">Conectando LED...</button>
  <button class="btn-action btn-history" onclick="location.href='historico.html'">Relatórios Avançados</button>
</div>

<script>
// Configuração Firebase
firebase.initializeApp({
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8"
});
const db = firebase.database();
const auth = firebase.auth();

let gT, gH;

function rodarDashboard() {
  const gOpt = (col) => ({
    angle: 0.15, lineWidth: 0.2, radiusScale: 1,
    pointer: { length: 0.6, strokeWidth: 0.04, color: '#f0f4f8' },
    colorStart: col, colorStop: col, strokeColor: '#1e293b',
    highDpiSupport: true, generateGradient: true
  });

  gT = new Gauge(document.getElementById("gTemp")).setOptions(gOpt('#f43f5e'));
  gT.maxValue = 60; gT.setMinValue(-10); gT.set(0);

  gH = new Gauge(document.getElementById("gHum")).setOptions(gOpt('#00d2ff'));
  gH.maxValue = 100; gH.setMinValue(0); gH.set(0);

  // Monitor de Status Online (30 segundos de tolerância)
  db.ref("/last_seen").on("value", snap => {
      const diff = Math.floor(Date.now() / 1000) - snap.val();
      const wifiSvg = document.getElementById("wifiSvg");
      const stBadge = document.getElementById("status");
      if (diff > 30) { 
          wifiSvg.setAttribute("stroke", "var(--off)");
          stBadge.className = "status-badge st-offline";
          stBadge.innerHTML = '<div class="dot"></div> DISPOSITIVO OFFLINE';
      } else {
          wifiSvg.setAttribute("stroke", "var(--on)");
          stBadge.className = "status-badge st-online";
          stBadge.innerHTML = '<div class="dot"></div> SISTEMA ATIVO';
      }
  });

  db.ref("/led").on("value", s => {
    const on = s.val() == 1;
    const b = document.getElementById("btnLED");
    b.innerText = on ? "DESATIVAR ILUMINAÇÃO" : "ATIVAR ILUMINAÇÃO";
    b.className = "btn-action btn-led " + (on ? "on" : "off");
  });

  db.ref("/temp").on("value", s => { 
    const v = parseFloat(s.val()); gT.set(v); 
    document.getElementById("tempVal").innerText = v.toFixed(1) + "°C";
  });

  db.ref("/hum").on("value", s => { 
    const v = parseFloat(s.val()); gH.set(v); 
    document.getElementById("humVal").innerText = v.toFixed(1) + "%";
  });
}

// Reset de Wi-Fi sem senha (apenas confirmação)
function menuRedeOculto() {
    if(confirm("Deseja colocar o equipamento em modo de configuração Wi-Fi?")) {
        db.ref("/config_wifi").set(1).then(() => {
            alert("Comando enviado! O ESP32 entrará em modo Setup. Conecte-se na rede 'NewEnergy_Setup'.");
        });
    }
}

document.getElementById("logoAdmin").onclick = () => {
    document.getElementById("adminPanel").style.display = "flex";
};

function salvarConfig() {
    const email = document.getElementById("cfgEmail").value;
    db.ref("/config_alertas").update({ emailDestino: email }).then(() => {
        alert("Configuração salva!");
        fecharAdmin();
    });
}

function fecharAdmin() { document.getElementById("adminPanel").style.display = "none"; }
function fazerLogout() { auth.signOut().then(() => window.location.replace("index.html")); }
document.getElementById("btnLED").onclick = () => { db.ref("/led").get().then(s => db.ref("/led").set(s.val() == 1 ? 0 : 1)); };

auth.onAuthStateChanged(user => { 
  if (!user) window.location.replace("index.html"); 
  else rodarDashboard(); 
});
</script>
</body>
</html>
