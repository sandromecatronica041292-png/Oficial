<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy - Painel</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0b0f1b;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
}
.card {
  background: #1b1f33;
  border-radius: 15px;
  padding: 25px;
  width: 420px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
}
h1 { text-align: center; margin-bottom: 20px; font-size: 26px; color: #00bcd4; }
.logo { text-align: center; margin-bottom: 20px; font-size: 20px; color: #00bcd4; font-weight: bold; }
.status { text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 12px; }
.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  margin-bottom: 12px;
  cursor: pointer;
}
.on { background: #16a34a; color: #fff; }
.off { background: #ef4444; color: #fff; }

.gauges { display: flex; justify-content: space-between; }
.gbox {
  width: 48%;
  text-align: center;
  background: #0c1424;
  padding: 15px;
  border-radius: 15px;
}
.gtitle { font-size: 14px; color: #8fa3c6; }
.gvalue { font-size: 22px; font-weight: bold; color: #00bcd4; }

#btnHistorico {
  background: #0c1424;
  color: #8fa3c6;
  border: 1px solid #1f2a44;
  font-size: 15px;
}

#alertMessage {
  text-align: center;
  font-size: 14px;
  color: #ffcc00;
  margin-bottom: 12px;
}

#wifiStatus {
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  margin-bottom: 12px;
}
#wifiLED {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  margin-right: 8px;
  background: gray;
  border: 1px solid #fff;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Gauge -->
<script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init("W2__8f2fBoqRPX9hX");
</script>
</head>

<body>
<div class="card">
  <div class="logo">NewEnergy</div>
  <h1>Monitoramento Industrial</h1>

  <!-- STATUS WIFI -->
  <div id="wifiStatus">
    <div id="wifiLED"></div>
    <div id="wifiText">Wi-Fi: Verificando...</div>
  </div>

  <div id="status" class="status">Verificando login...</div>
  <button id="btnLED" class="btn off">Carregando...</button>

  <div class="gauges">
    <div class="gbox">
      <div class="gtitle">Temperatura (°C)</div>
      <canvas id="gTemp" width="180" height="160"></canvas>
      <div id="tempVal" class="gvalue">-- °C</div>
    </div>
    <div class="gbox">
      <div class="gtitle">Umidade (%)</div>
      <canvas id="gHum" width="180" height="160"></canvas>
      <div id="humVal" class="gvalue">-- %</div>
    </div>
  </div>

  <div id="alertMessage"></div>

  <button id="btnHistorico" class="btn">Histórico</button>
</div>

<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* 🔒 PROTEÇÃO DO PAINEL */
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "index.html";
  } else {
    document.getElementById("status").innerText = "Conectado";
    iniciarPainel();
  }
});

/* ===== SISTEMA ===== */
function iniciarPainel() {
  const LEDREF  = db.ref("/led");
  const TEMPREF = db.ref("/temp");
  const HUMREF  = db.ref("/hum");
  const WIFIREF = db.ref("/wifi_status");

  const statusEl = document.getElementById("status");
  const btn = document.getElementById("btnLED");
  const tempVal = document.getElementById("tempVal");
  const humVal  = document.getElementById("humVal");
  const alertMessage = document.getElementById("alertMessage");

  const wifiLED = document.getElementById("wifiLED");
  const wifiText = document.getElementById("wifiText");

  const gaugeTemp = new Gauge(document.getElementById("gTemp")).setOptions({});
  gaugeTemp.maxValue = 50;
  gaugeTemp.setMinValue(0);

  const gaugeHum = new Gauge(document.getElementById("gHum")).setOptions({});
  gaugeHum.maxValue = 100;
  gaugeHum.setMinValue(0);

  let tempAtual = null;
  let humAtual = null;
  let ultimoAlerta = 0;

  const TEMP_MIN = 18, TEMP_MAX = 25;
  const HUM_MIN = 45, HUM_MAX = 60;

  function enviarAlertaEmail(temp, hum, tipo) {
    emailjs.send("service_kx31f3s", "template_mqzi3at", {
      equipamento: "NewEnergy - Painel Industrial",
      tipo: tipo,
      valor: `Temperatura: ${temp.toFixed(1)} °C | Umidade: ${hum.toFixed(1)} %`,
      data: new Date().toLocaleString("pt-BR")
    }).then(() => {
      alertMessage.innerText = "⚠️ Alerta enviado por e-mail";
    });
  }

  /* ===== LED ===== */
  LEDREF.on("value", snap => {
    const on = snap.val() == 1;
    statusEl.innerText = on ? "LED LIGADO" : "LED DESLIGADO";
    btn.innerText = on ? "DESLIGAR" : "LIGAR";
    btn.className = "btn " + (on ? "on" : "off");
  });

  btn.onclick = async () => {
    const s = await LEDREF.get();
    LEDREF.set(s.val() == 1 ? 0 : 1);
  };

  /* ===== TEMPERATURA ===== */
  TEMPREF.on("value", snap => {
    const t = Number(snap.val());
    if (!isNaN(t)) {
      tempAtual = t;
      gaugeTemp.set(t);
      tempVal.innerText = t.toFixed(1) + " °C";

      if ((t < TEMP_MIN || t > TEMP_MAX) && humAtual !== null && Date.now() - ultimoAlerta > 600000) {
        enviarAlertaEmail(tempAtual, humAtual, "Temperatura fora do padrão");
        ultimoAlerta = Date.now();
      }
    }
  });

  /* ===== UMIDADE ===== */
  HUMREF.on("value", snap => {
    const h = Number(snap.val());
    if (!isNaN(h)) {
      humAtual = h;
      gaugeHum.set(h);
      humVal.innerText = h.toFixed(1) + " %";

      if ((h < HUM_MIN || h > HUM_MAX) && tempAtual !== null && Date.now() - ultimoAlerta > 600000) {
        enviarAlertaEmail(tempAtual, humAtual, "Umidade fora do padrão");
        ultimoAlerta = Date.now();
      }
    }
  });

  /* ===== WIFI STATUS ===== */
  WIFIREF.on("value", snap => {
    const v = snap.val();
    if(v === 0){       // Vermelho: sem conexão
      wifiLED.style.background = "#ef4444";
      wifiText.innerText = "Wi-Fi: Sem conexão";
    } else if(v === 1){ // Amarelo: tentando reconectar
      wifiLED.style.background = "#facc15";
      wifiText.innerText = "Wi-Fi: Reconectando...";
    } else if(v === 2){ // Verde: conectado
      wifiLED.style.background = "#16a34a";
      wifiText.innerText = "Wi-Fi: Conectado";
    } else {            // Cinza padrão
      wifiLED.style.background = "gray";
      wifiText.innerText = "Wi-Fi: Verificando...";
    }
  });

  document.getElementById("btnHistorico").onclick = () => {
    window.location.href = "historico.html";
  };
}
</script>
</body>
</html>
