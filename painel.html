<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy | Monitor Pro</title>
<style>
  :root { 
    --bg-dark: #0b0f1b; --card-bg: #161b2d; --accent: #00d2ff; 
    --text-main: #ffffff; --text-muted: #8fa3c6; --on: #00ff88; 
    --off: #ff5722; --warn: #ffcc00; --glass: rgba(255, 255, 255, 0.05); 
  }
  
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
  
  .card { 
    background: var(--card-bg); border-radius: 20px; padding: 25px; width: 100%; 
    max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); 
    text-align: center; position: relative; overflow: hidden; 
  }

  /* Header */
  .header-main { position: relative; margin-bottom: 25px; padding-top: 10px; }
  .logo-principal { 
    font-size: 22px; text-transform: uppercase; letter-spacing: 4px; font-weight: 900; 
    background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; cursor: pointer; display: block; margin: 0 auto; 
  }
  .btn-logout { position: absolute; top: 0; right: 0; background: rgba(255, 87, 34, 0.1); border: 1px solid rgba(255,87,34,0.3); color: var(--off); padding: 4px 8px; border-radius: 6px; font-size: 9px; cursor: pointer; font-weight: 700; }

  h1 { font-size: 14px; color: var(--text-muted); margin: 0 0 15px 0; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; }

  /* Status e Botões */
  .status-badge { display: inline-block; padding: 6px 16px; border-radius: 50px; font-size: 10px; font-weight: 800; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
  .st-online { color: var(--on); border-color: var(--on); background: rgba(0, 255, 136, 0.1); }
  .st-offline { color: var(--off); border-color: var(--off); background: rgba(255, 87, 34, 0.1); }
  
  .btn-led { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-bottom: 12px; text-transform: uppercase; }
  .btn-led.on { background: var(--on); color: #052e16; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
  .btn-led.off { background: var(--off); color: #fff; box-shadow: 0 0 20px rgba(255, 87, 34, 0.1); }

  /* GAUGES CORRIGIDOS */
  .gauges-container { display: flex; gap: 12px; margin: 10px 0 25px 0; justify-content: center; }
  .gauge-box { 
    flex: 1; background: var(--glass); padding: 15px 5px; border-radius: 18px; 
    border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center;
    max-width: 180px;
  }
  .gauge-box canvas { width: 140px !important; height: 80px !important; }
  .g-title { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
  .g-value { font-size: 18px; font-weight: 900; color: var(--accent); margin-top: -5px; }

  /* Admin Panel */
  #adminPanel { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111628; border-radius: 20px; padding: 25px; box-sizing: border-box; z-index: 100; flex-direction: column; overflow-y: auto; text-align: left; }
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
  .admin-input { background: #0b0f1b; border: 1px solid #3d4455; color: white; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 13px; outline: none; }
  label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 4px; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
<div class="card">
  <div id="adminPanel">
    <div class="logo-principal" style="font-size: 16px; margin-bottom: 20px;">Configurações</div>
    <div class="admin-grid">
      <div><label>Temp Mín (°C)</label><input type="number" id="tMin" class="admin-input"></div>
      <div><label>Temp Máx (°C)</label><input type="number" id="tMax" class="admin-input"></div>
      <div><label>Hum Mín (%)</label><input type="number" id="hMin" class="admin-input"></div>
      <div><label>Hum Máx (%)</label><input type="number" id="hMax" class="admin-input"></div>
      <div><label>Tempo Real (s)</label><input type="number" id="cfgIntervalo" class="admin-input"></div>
      <div><label>Registros/24h</label><input type="number" id="cfgRegDia" class="admin-input"></div>
    </div>
    <div style="margin-bottom:15px;">
      <label>E-mail para Alertas</label>
      <input type="email" id="cfgEmail" class="admin-input" placeholder="seu@email.com">
    </div>
    <div style="margin-bottom:15px;">
      <label>Alerta a cada (Minutos)</label>
      <input type="number" id="cfgTempoEmail" class="admin-input">
    </div>

    <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #3d4455;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 10px; color: var(--text-muted); font-weight: bold;">E-MAILS/MÊS: <span id="countEmailDisplay" style="color: var(--accent);">0</span></span>
        <button onclick="resetarContador()" style="background: none; border: 1px solid var(--off); color: var(--off); font-size: 8px; padding: 2px 5px; border-radius: 4px; cursor: pointer;">ZERAR</button>
      </div>
      <div id="mesReferencia" style="font-size: 8px; color: #555; margin-top: 4px;">Ref: --/--</div>
    </div>
    
    <button id="btnSalvar" class="btn-led on" onclick="salvarConfig()">Salvar Alterações</button>
    <button class="btn-led" style="background:transparent; border:1px solid #3d4455; color:#888" onclick="fecharAdmin()">Sair</button>
  </div>

  <div class="header-main">
    <div class="logo-principal" id="logoAdmin">NewEnergy</div>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>
  
  <h1>Monitoramento Pro</h1>
  <div id="status" class="status-badge st-online">CONECTANDO...</div>
  
  <div class="gauges-container">
    <div class="gauge-box">
      <div class="g-title">Temperatura</div>
      <canvas id="gTemp"></canvas>
      <div id="tempVal" class="g-value">--°C</div>
    </div>
    <div class="gauge-box">
      <div class="g-title">Umidade</div>
      <canvas id="gHum"></canvas>
      <div id="humVal" class="g-value">--%</div>
    </div>
  </div>

  <div id="alertMessage" style="color:var(--warn); min-height:18px; font-size:11px; margin-bottom:15px; font-weight:800;"></div>
  
  <button id="btnLED" class="btn-led off">CARREGANDO LED...</button>
  <button class="btn-led" style="background: var(--glass); color: var(--accent); border: 1px solid var(--accent); margin-bottom: 0;" onclick="location.href='historico.html'">Relatórios & Histórico</button>
</div>

<script>
emailjs.init("W2__8f2fBoqRPX9hX");

firebase.initializeApp({
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8"
});
const db = firebase.database();
const auth = firebase.auth();

let config = { tMin: 15, tMax: 35, hMin: 30, hMax: 80, intervalo: 2000, registros_dia: 144, emailDestino: "", tempoEmail: 600000, contadorAlertas: 0 };
let gT, gH, ultimaVezAlertado = 0;

function rodarDashboard() {
  const gOpt = (col) => ({
    angle: 0.15, lineWidth: 0.2, radiusScale: 1,
    pointer: { length: 0.6, strokeWidth: 0.04, color: '#DDD' },
    colorStart: col, colorStop: col, strokeColor: '#1b1f33',
    highDpiSupport: true
  });

  gT = new Gauge(document.getElementById("gTemp")).setOptions(gOpt('#ff5722'));
  gT.maxValue = 60; gT.setMinValue(-10); gT.set(0);

  gH = new Gauge(document.getElementById("gHum")).setOptions(gOpt('#00d2ff'));
  gH.maxValue = 100; gH.setMinValue(0); gH.set(0);

  // Listeners Firebase
  db.ref("/last_seen").on("value", snap => {
    const last = snap.val() * 1000;
    const check = () => {
      const isOff = (Date.now() - last) > (config.intervalo + 15000);
      const st = document.getElementById("status");
      st.innerText = isOff ? "SISTEMA OFFLINE" : "SISTEMA ONLINE";
      st.className = "status-badge " + (isOff ? "st-offline" : "st-online");
    };
    check();
  });

  db.ref("/led").on("value", s => {
    const on = s.val() == 1;
    const b = document.getElementById("btnLED");
    b.innerText = on ? "APAGAR LUZ" : "ACENDER LUZ";
    b.className = "btn-led " + (on ? "on" : "off");
  });

  db.ref("/temp").on("value", s => { 
    const v = parseFloat(s.val()); gT.set(v); 
    document.getElementById("tempVal").innerText = v.toFixed(1) + "°C";
    analisarAlertas();
  });

  db.ref("/hum").on("value", s => { 
    const v = parseFloat(s.val()); gH.set(v); 
    document.getElementById("humVal").innerText = v.toFixed(1) + "%";
    analisarAlertas();
  });
}

function analisarAlertas() {
  const t = parseFloat(document.getElementById("tempVal").innerText);
  const h = parseFloat(document.getElementById("humVal").innerText);
  const msg = document.getElementById("alertMessage");
  let erroT = (t > config.tMax || t < config.tMin);
  let erroH = (h > config.hMax || h < config.hMin);
  
  msg.innerText = (erroT || erroH) ? "🚨 ALERTA: PARÂMETROS FORA DA MARGEM!" : "";

  const agora = Date.now();
  if ((erroT || erroH) && (agora - ultimaVezAlertado > config.tempoEmail)) {
    enviarEmailAlert(t, h);
  }
}

function enviarEmailAlert(t, h) {
  if (!config.emailDestino) return;
  emailjs.send("service_kx31f3s", "template_mqzi3at", {
    equipamento: "Monitor Pro",
    tipo: "Alerta de Limites",
    valor: `T: ${t}°C | H: ${h}%`,
    data: new Date().toLocaleString(),
    para_email: config.emailDestino
  }).then(() => {
    ultimaVezAlertado = Date.now();
    db.ref("/config_alertas/contadorAlertas").set((config.contadorAlertas || 0) + 1);
  });
}

// Admin Logic
let cliques = 0;
document.getElementById("logoAdmin").onclick = () => {
  if(++cliques >= 5) {
    document.getElementById("adminPanel").style.display = "flex";
    document.getElementById("tMin").value = config.tMin;
    document.getElementById("tMax").value = config.tMax;
    document.getElementById("hMin").value = config.hMin;
    document.getElementById("hMax").value = config.hMax;
    document.getElementById("cfgIntervalo").value = (config.intervalo / 1000);
    document.getElementById("cfgRegDia").value = config.registros_dia;
    document.getElementById("cfgEmail").value = config.emailDestino;
    document.getElementById("cfgTempoEmail").value = (config.tempoEmail / 60000);
    cliques = 0;
  }
};

function salvarConfig() {
  const btn = document.getElementById("btnSalvar");
  const updates = {
    tMin: parseFloat(document.getElementById("tMin").value),
    tMax: parseFloat(document.getElementById("tMax").value),
    hMin: parseFloat(document.getElementById("hMin").value),
    hMax: parseFloat(document.getElementById("hMax").value),
    intervalo: parseInt(document.getElementById("cfgIntervalo").value) * 1000,
    registros_dia: parseInt(document.getElementById("cfgRegDia").value),
    emailDestino: document.getElementById("cfgEmail").value,
    tempoEmail: parseInt(document.getElementById("cfgTempoEmail").value) * 60000
  };
  btn.innerText = "SALVANDO...";
  db.ref("/config_alertas").update(updates).then(() => {
    btn.innerText = "SALVO!";
    setTimeout(() => { fecharAdmin(); btn.innerText = "Salvar Alterações"; }, 800);
  });
}

function fecharAdmin() { document.getElementById("adminPanel").style.display = "none"; }
function resetarContador() { if(confirm("Zerar contador?")) db.ref("/config_alertas/contadorAlertas").set(0); }
function fazerLogout() { auth.signOut().then(() => window.location.replace("index.html")); }
document.getElementById("btnLED").onclick = () => { db.ref("/led").get().then(s => db.ref("/led").set(s.val() == 1 ? 0 : 1)); };

auth.onAuthStateChanged(user => { 
  if (!user) window.location.replace("index.html"); 
  else {
    db.ref("/config_alertas").on("value", s => { 
      if(s.val()) {
        config = s.val();
        document.getElementById("countEmailDisplay").innerText = config.contadorAlertas || 0;
        document.getElementById("mesReferencia").innerText = "Ref: " + (config.ultimoMesReset || "--/--");
      }
    });
    rodarDashboard(); 
  }
});
</script>
</body>
</html>
