<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Monitoramento</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  #lista { padding: 20px; max-height: 500px; overflow-y: auto; }
</style>
</head>
<body>

<h1 style="text-align:center;">Painel de Monitoramento</h1>

<div style="text-align:center; margin-bottom:20px;">
  <button onclick="fetchData('diario')">Diário</button>
  <button onclick="fetchData('semanal')">Semanal</button>
  <button onclick="fetchData('mensal')">Mensal</button>
  <button onclick="fetchData('anual')">Anual</button>
</div>

<div id="lista">
  <p style="text-align:center; padding:50px; color:#64748b;">Selecione um período para carregar os dados...</p>
</div>

<canvas id="grafico" style="max-width:800px; margin:0 auto; display:block;"></canvas>

<script>
  // Configuração Firebase
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_AUTH_DOMAIN",
    databaseURL: "SUA_DATABASE_URL",
    projectId: "SEU_PROJECT_ID",
    storageBucket: "SEU_BUCKET",
    messagingSenderId: "SEU_SENDER_ID",
    appId: "SEU_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let globalData = [];
  let myChart = null;

  // Função cirúrgica corrigida para buscar dados
  async function fetchData(periodo) {
      const listaDiv = document.getElementById("lista");
      listaDiv.innerHTML = "<p style='text-align:center; padding:50px; color:#64748b;'>Acessando Base de Dados Completa...</p>";
      globalData = [];

      try {
          const snapshot = await db.ref("/historico/" + periodo).once("value");
          const base = snapshot.val();
          if (!base) {
              listaDiv.innerHTML = "<p style='text-align:center; padding:40px;'>Nenhum registro encontrado.</p>";
              if(myChart) myChart.destroy();
              return;
          }

          const agora = new Date();
          const mesAtual = agora.getMonth();
          const anoAtual = agora.getFullYear();

          Object.keys(base).forEach(dia => {
              const registros = base[dia];
              Object.keys(registros).forEach(ts => {
                  const dt = new Date(parseInt(ts) * 1000); // timestamp do registro
                  const tsData = dt.getTime(); // timestamp em ms

                  let ok = false;

                  if (periodo === 'diario') {
                      const inicioDia = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()).getTime();
                      const fimDia = inicioDia + 24*60*60*1000;
                      ok = tsData >= inicioDia && tsData < fimDia;

                  } else if (periodo === 'semanal') {
                      const diaSemana = agora.getDay(); // 0 = domingo
                      const inicioSemana = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() - diaSemana).getTime();
                      const fimSemana = inicioSemana + 7*24*60*60*1000;
                      ok = tsData >= inicioSemana && tsData < fimSemana;

                  } else if (periodo === 'mensal') {
                      const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1).getTime();
                      const fimMes = new Date(agora.getFullYear(), agora.getMonth() + 1, 1).getTime();
                      ok = tsData >= inicioMes && tsData < fimMes;

                  } else if (periodo === 'anual') {
                      const inicioAno = new Date(agora.getFullYear(), 0, 1).getTime();
                      const fimAno = new Date(agora.getFullYear() + 1, 0, 1).getTime();
                      ok = tsData >= inicioAno && tsData < fimAno;
                  }

                  if (ok) {
                      globalData.push({
                          ts: parseInt(ts),
                          temp: parseFloat(registros[ts].temp),
                          hum: parseFloat(registros[ts].hum),
                          data: dt.toLocaleDateString('pt-BR'),
                          hora: dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
                      });
                  }
              });
          });

          globalData.sort((a,b) => b.ts - a.ts);
          renderUI();
          renderChart(periodo);
      } catch (e) {
          console.error(e);
      }
  }

  function renderUI() {
      const listaDiv = document.getElementById("lista");
      if(globalData.length === 0) {
          listaDiv.innerHTML = "<p style='text-align:center; padding:40px;'>Nenhum registro para este período.</p>";
          return;
      }

      listaDiv.innerHTML = "";
      globalData.forEach(item => {
          const p = document.createElement("p");
          p.textContent = `${item.data} ${item.hora} - Temp: ${item.temp.toFixed(2)}°C / Hum: ${item.hum.toFixed(2)}%`;
          listaDiv.appendChild(p);
      });
  }

  function renderChart(periodo) {
      const ctx = document.getElementById('grafico').getContext('2d');
      if(myChart) myChart.destroy();

      const labels = globalData.map(d => `${d.data} ${d.hora}`).reverse();
      const tempData = globalData.map(d => d.temp).reverse();
      const humData = globalData.map(d => d.hum).reverse();

      myChart = new Chart(ctx, {
          type: 'line',
          data: {
              labels: labels,
              datasets: [
                  { label: 'Temperatura (°C)', data: tempData, borderColor: 'red', fill: false },
                  { label: 'Umidade (%)', data: humData, borderColor: 'blue', fill: false }
              ]
          },
          options: {
              responsive: true,
              plugins: { legend: { display: true } },
              scales: { x: { display: true }, y: { display: true } }
          }
      });
  }
</script>

</body>
</html>
