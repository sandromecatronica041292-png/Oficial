<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy | Monitor Pro Intelligence</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root { 
    --brand-primary: #1a365d;    
    --brand-accent: #007aff;     
    --bg-body: #f1f5f9;          
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --on: #10b981;              
    --off: #e11d48;              
    --warn: #f59e0b;            
    --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
  }

  body { 
    margin: 0; font-family: 'Inter', sans-serif; 
    background: var(--bg-body); color: var(--text-main); 
    display: flex; justify-content: center; align-items: center; 
    min-height: 100vh; padding: 15px;
    background-image: radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.03) 0, transparent 50%);
  }

  .card { 
    background: var(--card-bg); border-radius: 20px; padding: 35px; width: 100%; 
    max-width: 440px; box-shadow: var(--shadow); 
    border: 1px solid rgba(0,0,0,0.03); text-align: center; 
    position: relative;
  }

  .header-main { position: relative; margin-bottom: 25px; }
  .logo-principal { 
    font-size: 18px; text-transform: uppercase; letter-spacing: 3px; font-weight: 800; 
    color: var(--brand-primary); cursor: pointer; transition: 0.3s;
  }

  .btn-logout { 
    position: absolute; top: -15px; right: -15px; background: #fff1f2; 
    border: 1px solid #ffe4e6; color: var(--off); 
    padding: 6px 12px; border-radius: 8px; font-size: 10px; cursor: pointer; font-weight: 700; 
  }

  .status-container { margin-bottom: 30px; }

  .status-badge { 
    display: inline-flex; align-items: center; gap: 8px; 
    padding: 6px 16px; border-radius: 50px; font-size: 11px; 
    font-weight: 700; letter-spacing: 0.5px; border: 1px solid rgba(0,0,0,0.05);
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; }

  .st-online .dot { background: var(--on); box-shadow: 0 0 8px var(--on); animation: pulse 2s infinite; }
  .st-offline .dot { background: var(--off); }

  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }

  .st-online { color: var(--on); background: #ecfdf5; }
  .st-offline { color: var(--off); background: #fff1f2; }

</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</head>

<body>

<div class="card">

  <div class="header-main">
    <div class="logo-principal">NewEnergy</div>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>

  <div class="status-container">
    <div id="status" class="status-badge st-online">
      <div class="dot"></div> <span>SINCRONIZANDO...</span>
    </div>
  </div>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8"
});

const db = firebase.database();
const auth = firebase.auth();

/* =========================
   🔧 CORREÇÃO CIRÚRGICA AQUI
   ========================= */

db.ref("/last_seen").on("value", snap => {

  const last = snap.val();

  // ✔ FIX 1: evita null / undefined / 0 inválido
  if (!last || isNaN(last)) {
    setOffline();
    return;
  }

  const lastMs = Number(last) * 1000;
  const diff = Date.now() - lastMs;

  // ✔ FIX 2: tolerância segura (30s)
  const isOff = diff > 30000;

  const st = document.getElementById("status");

  if (isOff) {
    st.innerHTML = '<div class="dot"></div> SISTEMA OFFLINE';
    st.className = "status-badge st-offline";
  } else {
    st.innerHTML = '<div class="dot"></div> MONITORAMENTO ATIVO';
    st.className = "status-badge st-online";
  }
});

function setOffline() {
  const st = document.getElementById("status");
  st.innerHTML = '<div class="dot"></div> SISTEMA OFFLINE';
  st.className = "status-badge st-offline";
}

/* resto do sistema continua igual */

function fazerLogout() {
  auth.signOut().then(() => window.location.replace("index.html"));
}

auth.onAuthStateChanged(user => {
  if (!user) window.location.replace("index.html");
});

</script>

</body>
</html>
