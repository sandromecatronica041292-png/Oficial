<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NewEnergy Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        :root { --bg: #0b101e; --card: #161c2d; --accent: #00d2ff; --on: #00ff88; --off: #ff5722; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--card); border-radius: 25px; padding: 30px; width: 380px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 1px solid #2a324d; position: relative; }
        .logo { font-size: 28px; font-weight: 900; color: var(--accent); letter-spacing: 2px; margin-bottom: 20px; display: block; }
        .st-badge { display: inline-block; padding: 5px 12px; border-radius: 50px; font-size: 10px; font-weight: bold; margin-bottom: 20px; border: 1px solid #444; }
        .online { color: var(--on); border-color: var(--on); }
        .btn-led { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-bottom: 20px; }
        .btn-on { background: var(--on); color: #052e16; }
        .btn-off { background: var(--off); color: white; }
        .g-container { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .g-box { flex: 1; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 15px; }
        .v-text { font-size: 20px; font-weight: bold; margin-top: 5px; color: var(--accent); }
        canvas { width: 120px !important; height: auto !important; }
        #adminPanel { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111628; border-radius: 25px; padding: 25px; z-index: 10; flex-direction: column; text-align: left; box-sizing: border-box; }
        .input-adm { background: #0b101e; border: 1px solid #3d4455; color: white; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <div id="adminPanel">
        <h3 style="color:var(--accent)">Configuração</h3>
        <label style="font-size:10px">E-MAIL DE ALERTA</label>
        <input type="email" id="inEmail" class="input-adm">
        <label style="font-size:10px">TEMP MÁXIMA (°C)</label>
        <input type="number" id="inTMax" class="input-adm">
        <button class="btn-led btn-on" onclick="salvarConfig()">SALVAR</button>
        <button class="btn-led" style="background:none; color:#888" onclick="fecharAdmin()">VOLTAR</button>
    </div>

    <span class="logo" id="btnAdmin">NEWENERGY</span>
    <div id="stTxt" class="st-badge">CONECTANDO AO FIREBASE...</div>

    <button id="btnLED" class="btn-led btn-off">AGUARDANDO DADOS...</button>

    <div class="g-container">
        <div class="g-box">
            <canvas id="cT"></canvas>
            <div id="vT" class="v-text">--°C</div>
            <div style="font-size:9px; color:#888">TEMPERATURA</div>
        </div>
        <div class="g-box">
            <canvas id="cH"></canvas>
            <div id="vH" class="v-text">--%</div>
            <div style="font-size:9px; color:#888">UMIDADE</div>
        </div>
    </div>
</div>

<script>
    emailjs.init("W2__8f2fBoqRPX9hX");
    const fbConf = { databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(fbConf);
    const db = firebase.database();

    let config = { tMax: 35, emailDestino: "" };
    let ultimoAlerta = 0;

    const opt = (col) => ({ angle: 0.15, lineWidth: 0.1, pointer: { length: 0.6, color: '#fff' }, colorStart: col, colorStop: col, strokeColor: '#1b1f33' });
    const gT = new Gauge(document.getElementById('cT')).setOptions(opt('#00d2ff'));
    const gH = new Gauge(document.getElementById('cH')).setOptions(opt('#00ff88'));
    gT.maxValue = 60; gT.setMinValue(-10); gT.set(0);
    gH.maxValue = 100; gH.setMinValue(0); gH.set(0);

    // ESCUTA EM TEMPO REAL (RESILIENTE)
    db.ref().on("value", snapshot => {
        const d = snapshot.val();
        if(!d) return;

        document.getElementById('stTxt').innerText = "SISTEMA ONLINE";
        document.getElementById('stTxt').className = "st-badge online";

        if(d.temp !== undefined) {
            gT.set(parseFloat(d.temp));
            document.getElementById('vT').innerText = parseFloat(d.temp).toFixed(1) + "°C";
        }
        if(d.hum !== undefined) {
            gH.set(parseFloat(d.hum));
            document.getElementById('vH').innerText = parseFloat(d.hum).toFixed(1) + "%";
        }
        
        const btn = document.getElementById('btnLED');
        btn.innerText = d.led == 1 ? "APAGAR LUZ" : "ACENDER LUZ";
        btn.className = "btn-led " + (d.led == 1 ? "btn-on" : "btn-off");

        // Lógica de E-mail
        if(d.temp > config.tMax && (Date.now() - ultimoAlerta > 600000)) {
            if(config.emailDestino) {
                emailjs.send("service_kx31f3s", "template_mqzi3at", {
                    subject: "ALERTA DE TEMPERATURA",
                    message: `A temperatura atingiu ${d.temp}°C`,
                    para_email: config.emailDestino
                });
                ultimoAlerta = Date.now();
            }
        }
    });

    db.ref("config_alertas").on("value", s => { if(s.val()) config = s.val(); });

    document.getElementById('btnLED').onclick = () => {
        db.ref("led").once("value", s => db.ref("led").set(s.val() == 1 ? 0 : 1));
    };

    // Admin (5 cliques no logo)
    let count = 0;
    document.getElementById('btnAdmin').onclick = () => { if(++count >= 5) { document.getElementById('adminPanel').style.display='flex'; count=0; }};
    function fecharAdmin() { document.getElementById('adminPanel').style.display='none'; }
    function salvarConfig() {
        db.ref("config_alertas").update({
            emailDestino: document.getElementById('inEmail').value,
            tMax: document.getElementById('inTMax').value
        }).then(() => fecharAdmin());
    }
</script>
</body>
</html>
