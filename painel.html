<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy | Monitor Pro</title>
<style>
  :root { --bg-dark: #0b0f1b; --card-bg: #161b2d; --accent: #00d2ff; --text-main: #ffffff; --text-muted: #8fa3c6; --on: #00ff88; --off: #ff5722; --warn: #ffcc00; --glass: rgba(255, 255, 255, 0.03); }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
  
  .card { background: var(--card-bg); border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); text-align: center; position: relative; overflow: hidden; }
  .logo-top { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: var(--accent); margin-bottom: 5px; cursor: pointer; user-select: none; font-weight: 700; }
  h1 { font-size: 20px; margin: 0 0 15px 0; font-weight: 800; letter-spacing: -0.5px; }
  
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 10px; font-weight: 700; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
  .st-online { color: var(--on); border-color: var(--on); background: rgba(0, 255, 136, 0.1); }
  .st-offline { color: var(--off); border-color: var(--off); background: rgba(255, 87, 34, 0.1); }
  
  .btn-led { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; margin-bottom: 20px; text-transform: uppercase; }
  .btn-led.on { background: var(--on); color: #052e16; }
  .btn-led.off { background: var(--off); color: #fff; }

  .gauges-container { display: flex; gap: 10px; margin-bottom: 20px; }
  .gauge-box { flex: 1; background: var(--glass); padding: 12px 5px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
  .g-title { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
  .g-value { font-size: 18px; font-weight: 800; color: var(--accent); margin-top: -5px; }
  canvas { width: 100% !important; height: auto !important; max-width: 130px; margin: 0 auto; }

  /* Painel Administrativo */
  #adminPanel { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); border-radius: 20px; padding: 20px; box-sizing: border-box; z-index: 10; flex-direction: column; overflow-y: auto; text-align: left; }
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .admin-grid label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 4px; }
  .admin-input { background: #0b0f1b; border: 1px solid #333; color: white; padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 12px; margin-bottom: 10px; }
  
  .btn-hist { width: 100%; padding: 12px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); border-radius: 10px; cursor: pointer; font-size: 11px; margin-top: 5px; }
  .btn-test { background: rgba(0, 210, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); margin-bottom: 10px; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
<div class="card">
  <div id="adminPanel">
    <h3 style="margin: 0 0 15px 0; font-size:16px;">Configurações</h3>
    <div class="admin-grid">
      <div><label>Temp Mín (°C)</label><input type="number" id="tMin" class="admin-input"></div>
      <div><label>Temp Máx (°C)</label><input type="number" id="tMax" class="admin-input"></div>
      <div><label>Hum Mín (%)</label><input type="number" id="hMin" class="admin-input"></div>
      <div><label>Hum Máx (%)</label><input type="number" id="hMax" class="admin-input"></div>
    </div>
    
    <label style="font-size: 9px; color: var(--text-muted); text-transform: uppercase;">E-mail Destinatário:</label>
    <input type="email" id="cfgEmail" class="admin-input" placeholder="cliente@email.com">

    <button class="btn-led on" onclick="salvarConfig()">Salvar Configurações</button>
    <button class="btn-led btn-test" onclick="testeRapidoEmail()">Testar E-mail</button>
    <button class="btn-hist" onclick="fecharAdmin()">Fechar</button>
  </div>

  <div class="logo-top" id="logoAdmin">NewEnergy RT</div>
  <h1>Status em Tempo Real</h1>
  <div id="status" class="status-badge st-online">Sincronizando...</div>
  
  <button id="btnLED" class="btn-led off">Aguardando...</button>

  <div class="gauges-container">
    <div class="gauge-box">
      <div class="g-title">Temperatura</div>
      <canvas id="gTemp"></canvas>
      <div id="tempVal" class="g-value">--°C</div>
    </div>
    <div class="gauge-box">
      <div class="g-title">Umidade</div>
      <canvas id="gHum"></canvas>
      <div id="humVal" class="g-value">--%</div>
    </div>
  </div>

  <div id="alertMessage" style="color:var(--warn); min-height:15px; font-size:11px; margin-bottom:15px; font-weight:700;"></div>
  <button class="btn-hist" onclick="location.href='historico.html'">Histórico Completo</button>
</div>

<script>
emailjs.init("W2__8f2fBoqRPX9hX");

const firebaseConfig = {
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let config = { tMin: 15, tMax: 35, hMin: 30, hMax: 80, emailDestino: "" };

auth.onAuthStateChanged(user => { 
  if (!user) location.href = "index.html"; 
  else {
    db.ref("/config_alertas").on("value", s => { if(s.val()) config = s.val(); });
    rodarPainel(); 
  }
});

function rodarPainel() {
  const gOpt = (col) => ({ angle: 0.2, lineWidth: 0.15, pointer: { length: 0.5, color: '#DDD' }, colorStart: col, colorStop: col, strokeColor: '#1b1f33', highDpiSupport: true });
  const gT = new Gauge(document.getElementById("gTemp")).setOptions(gOpt('#00d2ff'));
  gT.maxValue = 60; gT.setMinValue(-10); gT.animationSpeed = 100;
  const gH = new Gauge(document.getElementById("gHum")).setOptions(gOpt('#00ff88'));
  gH.maxValue = 100; gH.setMinValue(0); gH.animationSpeed = 100;

  // Monitoramento de Conexão (Heartbeat)
  db.ref("/last_seen").on("value", snap => {
    const last = snap.val() * 1000;
    const check = () => {
      const isOff = (Date.now() - last) > 95000;
      const st = document.getElementById("status");
      st.innerText = isOff ? "DISPOSITIVO OFFLINE" : "DISPOSITIVO ONLINE";
      st.className = "status-badge " + (isOff ? "st-offline" : "st-online");
    };
    check();
    if(window.iv) clearInterval(window.iv);
    window.iv = setInterval(check, 10000);
  });

  // Controle do LED
  db.ref("/led").on("value", snap => {
    const on = snap.val() == 1;
    document.getElementById("btnLED").innerText = on ? "Desligar LED" : "Ligar LED";
    document.getElementById("btnLED").className = "btn-led " + (on ? "on" : "off");
  });

  document.getElementById("btnLED").onclick = () => {
    db.ref("/led").get().then(s => db.ref("/led").set(s.val() == 1 ? 0 : 1));
  };

  // Leitura de Sensores
  db.ref("/temp").on("value", s => { 
    const v = parseFloat(s.val()); gT.set(v); 
    document.getElementById("tempVal").innerText = v.toFixed(1) + "°C";
    processarAlertas(v, parseFloat(document.getElementById("humVal").innerText));
  });
  
  db.ref("/hum").on("value", s => { 
    const v = parseFloat(s.val()); gH.set(v); 
    document.getElementById("humVal").innerText = v.toFixed(1) + "%";
    processarAlertas(parseFloat(document.getElementById("tempVal").innerText), v);
  });
}

function processarAlertas(t, h) {
  if(isNaN(t) || isNaN(h)) return;
  const msg = document.getElementById("alertMessage");
  let erroT = (t > config.tMax || t < config.tMin);
  let erroH = (h > config.hMax || h < config.hMin);
  let txt = "";

  if (erroT && erroH) txt = "🚨 CRÍTICO: TEMP E HUM FORA!";
  else if (erroT) txt = "🚨 ALERTA: TEMPERATURA FORA DO LIMITE!";
  else if (erroH) txt = "🚨 ALERTA: UMIDADE FORA DO LIMITE!";

  msg.innerText = txt;
  if(txt !== "") enviarEmail(txt, `Temp Atual: ${t}°C | Hum Atual: ${h}%`);
}

// LOGICA ADMIN OCULTO (5 cliques na logo)
let cliques = 0;
document.getElementById("logoAdmin").onclick = () => {
  if(++cliques >= 5) {
    document.getElementById("adminPanel").style.display = "flex";
    document.getElementById("tMin").value = config.tMin;
    document.getElementById("tMax").value = config.tMax;
    document.getElementById("hMin").value = config.hMin;
    document.getElementById("hMax").value = config.hMax;
    document.getElementById("cfgEmail").value = config.emailDestino || "";
    cliques = 0;
  }
};

function salvarConfig() {
  const novosValores = {
    tMin: parseFloat(document.getElementById("tMin").value),
    tMax: parseFloat(document.getElementById("tMax").value),
    hMin: parseFloat(document.getElementById("hMin").value),
    hMax: parseFloat(document.getElementById("hMax").value),
    emailDestino: document.getElementById("cfgEmail").value
  };
  db.ref("/config_alertas").set(novosValores).then(() => {
    alert("Salvo com sucesso!");
    fecharAdmin();
  });
}

function fecharAdmin() { document.getElementById("adminPanel").style.display = "none"; }

function testeRapidoEmail() {
  const mail = document.getElementById("cfgEmail").value;
  if(!mail) return alert("Insira um e-mail primeiro!");
  enviarEmail("TESTE DE SISTEMA", "Seu sistema de alertas está funcionando perfeitamente.");
  alert("Teste enviado!");
}

function enviarEmail(tipo, valor) {
  if (!config.emailDestino) return;
  // Cooldown de 10 minutos por alerta
  if (window.lastAlert && Date.now() - window.lastAlert < 600000) return;
  window.lastAlert = Date.now();
  
  emailjs.send("service_kx31f3s", "template_mqzi3at", { 
    tipo: tipo, 
    valor: valor, 
    para_email: config.emailDestino, 
    data: new Date().toLocaleString() 
  });
}
</script>
</body>
</html>
