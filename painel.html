<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy | Live Monitor</title>

<style>
  :root {
    --bg-dark: #0b0f1b;
    --card-bg: #161b2d;
    --accent: #00d2ff;
    --accent-glow: rgba(0, 210, 255, 0.3);
    --text-main: #ffffff;
    --text-muted: #8fa3c6;
    --on: #00ff88;
    --off: #ff5722;
    --glass: rgba(255, 255, 255, 0.03);
  }

  body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 35px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.05);
    text-align: center;
  }

  .logo-top {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 700;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 25px 0;
    font-weight: 800;
    letter-spacing: -1px;
  }

  .status-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    background: var(--glass);
    margin-bottom: 25px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .btn-led {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  .btn-led.on { background: var(--on); color: #052e16; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
  .btn-led.off { background: var(--off); color: #450a0a; }
  .btn-led:active { transform: scale(0.96); }

  .gauges-container {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
  }

  .gauge-box {
    flex: 1;
    background: var(--glass);
    padding: 20px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
  }

  .g-title {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  .g-value {
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    margin-top: -10px;
  }

  #alertMessage {
    min-height: 20px;
    font-size: 13px;
    color: #ffcc00;
    margin-bottom: 20px;
    font-weight: 500;
  }

  .btn-hist {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 2px solid var(--glass);
    color: var(--text-muted);
    border-radius: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn-hist:hover {
    background: var(--glass);
    color: var(--text-main);
    border-color: var(--accent);
  }

  canvas { max-width: 100%; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
<div class="card">
  <div class="logo-top">NewEnergy</div>
  <h1>Painel de Controle</h1>

  <div id="status" class="status-badge">Sincronizando...</div>
  
  <button id="btnLED" class="btn-led off">Conectando...</button>

  <div class="gauges-container">
    <div class="gauge-box">
      <div class="g-title">Temperatura</div>
      <canvas id="gTemp"></canvas>
      <div id="tempVal" class="g-value">-- °C</div>
    </div>
    
    <div class="gauge-box">
      <div class="g-title">Umidade</div>
      <canvas id="gHum"></canvas>
      <div id="humVal" class="g-value">-- %</div>
    </div>
  </div>

  <div id="alertMessage"></div>

  <button id="btnHistorico" class="btn-hist">Acessar Histórico</button>
</div>

<script>
emailjs.init("W2__8f2fBoqRPX9hX");

const firebaseConfig = {
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

auth.onAuthStateChanged(user => {
  if (!user) window.location.href = "index.html";
  else iniciarPainel();
});

function iniciarPainel() {
  const LEDREF = db.ref("/led");
  const TEMPREF = db.ref("/temp");
  const HUMREF = db.ref("/hum");

  const gaugeOpts = (color) => ({
    angle: 0.15,
    lineWidth: 0.2,
    radiusScale: 1,
    pointer: { length: 0.6, strokeWidth: 0.035, color: '#FFFFFF' },
    limitMax: false,
    limitMin: false,
    colorStart: color,
    colorStop: color,
    strokeColor: '#1f2a44',
    generateGradient: true,
    highDpiSupport: true
  });

  // GAUGE TEMPERATURA (-40 a 125)
  const gTemp = new Gauge(document.getElementById("gTemp")).setOptions(gaugeOpts('#00d2ff'));
  gTemp.maxValue = 125;
  gTemp.setMinValue(-40);
  gTemp.animationSpeed = 32;

  // GAUGE UMIDADE (0 a 100)
  const gHum = new Gauge(document.getElementById("gHum")).setOptions(gaugeOpts('#00ff88'));
  gHum.maxValue = 100;
  gHum.setMinValue(0);
  gHum.animationSpeed = 32;

  let tAt = null, hAt = null, lastAlert = 0, canAlert = false;

  setTimeout(() => { canAlert = true; }, 60000);

  /* LED */
  LEDREF.on("value", snap => {
    const on = snap.val() == 1;
    document.getElementById("status").innerText = on ? "SISTEMA ATIVO" : "SISTEMA EM ESPERA";
    document.getElementById("btnLED").innerText = on ? "Desligar Led" : "Ligar Led";
    document.getElementById("btnLED").className = "btn-led " + (on ? "on" : "off");
  });

  document.getElementById("btnLED").onclick = async () => {
    const s = await LEDREF.get();
    LEDREF.set(s.val() == 1 ? 0 : 1);
  };

  /* SENSORES */
  TEMPREF.on("value", snap => {
    const t = Number(snap.val());
    tAt = t;
    gTemp.set(t);
    document.getElementById("tempVal").innerText = t.toFixed(1) + " °C";
    check();
  });

  HUMREF.on("value", snap => {
    const h = Number(snap.val());
    hAt = h;
    gHum.set(h);
    document.getElementById("humVal").innerText = h.toFixed(1) + " %";
    check();
  });

  function check() {
    if (tAt === null || hAt === null || !canAlert) return;
    if ((tAt < 18 || tAt > 25) || (hAt < 45 || hAt > 60)) {
      if (Date.now() - lastAlert > 600000) {
        emailjs.send("service_kx31f3s", "template_mqzi3at", {
          equipamento: "NewEnergy Monitor",
          tipo: "Anomalia Detectada",
          valor: `T: ${tAt.toFixed(1)}°C | U: ${hAt.toFixed(1)}%`,
          data: new Date().toLocaleString()
        });
        document.getElementById("alertMessage").innerText = "⚠️ Notificação de alerta enviada";
        lastAlert = Date.now();
      }
    } else {
      document.getElementById("alertMessage").innerText = "";
    }
  }

  document.getElementById("btnHistorico").onclick = () => window.location.href = "historico.html";
}
</script>
</body>
</html>
