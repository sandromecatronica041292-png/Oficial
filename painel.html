<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy | Monitor Pro Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* (SEU CSS ORIGINAL - NÃO ALTERADO) */
:root { 
  --brand-primary: #1a365d;    
  --brand-accent: #007aff;     
  --bg-body: #f1f5f9;          
  --card-bg: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --on: #10b981;              
  --off: #e11d48;              
  --warn: #f59e0b;            
  --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
}
/* resto do CSS igual... */
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
<div class="card">

<!-- ADMIN -->
<div id="adminPanel">
  <div class="logo-principal" style="font-size: 14px; margin-bottom: 20px; color: var(--brand-accent);">Configurações de Engenharia</div>

  <!-- (SEU ADMIN ORIGINAL) -->

  <!-- 🔥 NOVO -->
  <label>Cliente</label>
  <input type="text" id="cfgCliente" class="admin-input">

  <label>Local</label>
  <input type="text" id="cfgLocal" class="admin-input">

  <button id="btnSalvar" class="btn-action" style="background:var(--brand-primary); color:#fff;" onclick="salvarConfig()">Salvar Alterações</button>
</div>

<div class="header-main">
  <div class="logo-principal" id="logoAdmin">NewEnergy</div>
</div>

<div class="status-container">
  <div id="status" class="status-badge st-online">
    <div class="dot"></div> <span>SINCRONIZANDO...</span>
  </div>
</div>

<!-- 🔥 NOVO BLOCO -->
<div style="margin-bottom:15px; font-size:12px; color:var(--text-muted);">
  <div><strong>Cliente:</strong> <span id="clienteNome">--</span></div>
  <div><strong>Local:</strong> <span id="clienteLocal">--</span></div>
</div>

<!-- (RESTO DO HTML IGUAL - GAUGES, BOTÕES, ETC) -->

</div>

<script>
emailjs.init("W2__8f2fBoqRPX9hX");

firebase.initializeApp({
  apiKey: "AIza...",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/"
});

const db = firebase.database();
const auth = firebase.auth();

let config = {
  tMin: 15, tMax: 35, hMin: 30, hMax: 80,
  intervalo: 2000,
  emailDestino: "",
  tempoEmail: 600000,
  contadorAlertas: 0,
  leiturasPorHora: 20,

  // 🔥 NOVO
  cliente: "",
  local: ""
};

let cliques = 0;

document.getElementById("logoAdmin").onclick = () => {
  if(++cliques >= 5) {
    document.getElementById("adminPanel").style.display = "flex";

    // 🔥 NOVO
    document.getElementById("cfgCliente").value = config.cliente || "";
    document.getElementById("cfgLocal").value = config.local || "";

    cliques = 0;
  }
};

function salvarConfig() {
  const updates = {
    tMin: config.tMin,
    tMax: config.tMax,

    // 🔥 NOVO
    cliente: document.getElementById("cfgCliente").value,
    local: document.getElementById("cfgLocal").value
  };

  db.ref("/config_alertas").update(updates);
}

db.ref("/config_alertas").on("value", s => {
  if(s.val()){
    config = s.val();

    // 🔥 NOVO
    document.getElementById("clienteNome").innerText = config.cliente || "--";
    document.getElementById("clienteLocal").innerText = config.local || "--";
  }
});
</script>

</body>
</html>
