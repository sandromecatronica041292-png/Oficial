<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NewEnergy | Business Intelligence</title>
    <style>
        :root { --bg: #070a13; --card: #101625; --accent: #00d2ff; --temp: #f43f5e; --text: #f0f4f8; --muted: #64748b; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .card { background: var(--card); border-radius: 24px; padding: 25px; width: 100%; max-width: 850px; border: 1px solid rgba(255,255,255,0.08); }
        .tabs { display: flex; gap: 5px; background: #000; padding: 5px; border-radius: 12px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .tab.active { background: var(--card); color: var(--accent); }
        .chart-container { height: 300px; margin-bottom: 20px; }
        #lista { max-height: 350px; overflow-y: auto; }
        .item { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 13px; border-left: 4px solid transparent; }
        .item.alerta { border-left-color: var(--temp); background: rgba(244, 63, 94, 0.05); }
        .data-divider { color: var(--accent); font-size: 11px; margin: 15px 0 5px; font-weight: bold; text-transform: uppercase; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--accent); color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="card">
    <h2>Performance Analítica</h2>
    <div class="tabs">
        <div class="tab active" onclick="setTab(this, 'diario')">DIÁRIO</div>
        <div class="tab" onclick="setTab(this, 'semanal')">SEMANAL</div>
        <div class="tab" onclick="setTab(this, 'mensal')">MENSAL</div>
    </div>
    <div class="chart-container"><canvas id="mainChart"></canvas></div>
    <div id="lista"></div>
    <button class="btn" onclick="location.href='painel.html'">VOLTAR AO PAINEL</button>
</div>

<script>
firebase.initializeApp({
    databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/"
});
const db = firebase.database();
let myChart = null, dadosGerais = [];

async function carregarDados(periodo) {
    const lista = document.getElementById("lista");
    lista.innerHTML = "Sincronizando...";
    
    const snap = await db.ref("/historico/diario").once("value");
    const base = snap.val();
    if(!base) { lista.innerHTML = "Sem dados."; return; }

    dadosGerais = [];
    const agora = new Date();
    const hojeStr = agora.toLocaleDateString('pt-BR');

    Object.keys(base).forEach(dia => {
        Object.keys(base[dia]).forEach(ts => {
            const d = base[dia][ts];
            const dataObj = new Date(parseInt(ts) * 1000);
            const dataStr = dataObj.toLocaleDateString('pt-BR');
            
            let incluir = false;
            if(periodo === 'diario' && dataStr === hojeStr) incluir = true;
            else if(periodo === 'semanal' && (agora - dataObj) <= 7*86400000) incluir = true;
            else if(periodo === 'mensal' && (agora - dataObj) <= 30*86400000) incluir = true;

            if(incluir) {
                dadosGerais.push({
                    ts: parseInt(ts),
                    temp: d.temp,
                    hum: d.hum,
                    data: dataStr,
                    hora: dataObj.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
                });
            }
        });
    });

    dadosGerais.sort((a,b) => b.ts - a.ts);
    renderizar(periodo);
}

function renderizar(periodo) {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    let ultimaData = "";

    dadosGerais.forEach(d => {
        if(d.data !== ultimaData) {
            lista.innerHTML += `<div class="data-divider">Data: ${d.data}</div>`;
            ultimaData = d.data;
        }
        lista.innerHTML += `
            <div class="item">
                <span><b>${d.hora}</b></span>
                <span>Temp: <b style="color:var(--temp)">${d.temp}°C</b></span>
                <span>Umid: <b style="color:var(--accent)">${d.hum}%</b></span>
            </div>`;
    });

    const chartData = [...dadosGerais].sort((a,b) => a.ts - b.ts);
    if(myChart) myChart.destroy();
    myChart = new Chart(document.getElementById('mainChart'), {
        type: 'line',
        data: {
            labels: chartData.map(d => periodo === 'diario' ? d.hora : d.data),
            datasets: [
                { label: 'Temp', data: chartData.map(d => d.temp), borderColor: '#f43f5e', tension: 0.4 },
                { label: 'Umid', data: chartData.map(d => d.hum), borderColor: '#00d2ff', tension: 0.4 }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
}

function setTab(el, p) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    carregarDados(p);
}

carregarDados('diario');
</script>
</body>
</html>
