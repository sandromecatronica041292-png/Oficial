<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy | Business Intelligence</title>

<style>
  :root {
    --bg-dark: #0b0f1b;
    --card-bg: #161b2d;
    --accent: #00d2ff;
    --accent-hover: #0099cc;
    --text-main: #ffffff;
    --text-muted: #8fa3c6;
    --danger: #ff5722;
    --glass: rgba(255, 255, 255, 0.03);
  }

  body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 850px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  h1 {
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--accent);
    margin: 0;
    font-size: 28px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .tabs {
    display: flex;
    background: rgba(0,0,0,0.2);
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 25px;
  }

  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s ease;
    color: var(--text-muted);
  }

  .tab.active {
    background: var(--accent);
    color: var(--bg-dark);
    box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
  }

  .canvas-wrapper {
    background: var(--glass);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  canvas {
    max-height: 200px;
    width: 100% !important;
  }

  #lista {
    max-height: 350px;
    overflow-y: auto;
    padding-right: 10px;
    margin-top: 20px;
  }

  /* Custom Scrollbar */
  #lista::-webkit-scrollbar { width: 6px; }
  #lista::-webkit-scrollbar-track { background: transparent; }
  #lista::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

  .item {
    background: var(--glass);
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid transparent;
    transition: 0.2s;
  }

  .item:hover {
    border-color: rgba(0, 210, 255, 0.3);
    background: rgba(255,255,255,0.05);
  }

  .data-group .time { font-weight: 600; font-size: 15px; display: block; }
  .data-group .date { font-size: 12px; color: var(--text-muted); }

  .val-group { display: flex; gap: 20px; }
  .val-unit { text-align: right; }
  .val-unit label { font-size: 10px; color: var(--text-muted); display: block; text-transform: uppercase; }
  .val-unit span { font-weight: 700; color: var(--accent); font-size: 16px; }

  .btn-container {
    display: flex;
    gap: 15px;
    margin-top: 30px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary { background: var(--accent); color: var(--bg-dark); }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
  
  .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text-main); }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }

  @media (max-width: 600px) {
    .val-group { gap: 10px; }
    .card { padding: 15px; }
  }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
  <header>
    <div class="subtitle">Data Intelligence</div>
    <h1>NewEnergy Solutions</h1>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="trocarAba('diario',this)">Diário</div>
    <div class="tab" onclick="trocarAba('semanal',this)">Semanal</div>
    <div class="tab" onclick="trocarAba('mensal',this)">Mensal</div>
    <div class="tab" onclick="trocarAba('anual',this)">Anual</div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="graficoTemp"></canvas>
  </div>
  <div class="canvas-wrapper">
    <canvas id="graficoHum"></canvas>
  </div>

  <div id="lista"></div>

  <div class="btn-container">
    <button class="btn btn-primary" onclick="exportarPDF()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Exportar PDF
    </button>
    <button class="btn btn-secondary" onclick="location.href='painel.html'">Voltar</button>
  </div>
</div>

<script>
/* ===== FIREBASE (Inalterado) ===== */
firebase.initializeApp({
  apiKey:"AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain:"oficial-688e8.firebaseapp.com",
  databaseURL:"https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId:"oficial-688e8"
});
const auth = firebase.auth();
const db = firebase.database();

auth.onAuthStateChanged(u => { if(!u) location.href="index.html"; });

let abaAtual = "diario";
let chartTemp=null, chartHum=null;
let dadosTela = [];

function trocarAba(aba,el){
  abaAtual = aba;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  carregarHistorico();
}

function carregarHistorico(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "<p style='text-align:center; color:#8fa3c6;'>Sincronizando com servidor...</p>";
  dadosTela = [];

  db.ref("/historico/"+abaAtual).once("value").then(snap=>{
    const base = snap.val();
    if(!base){
      lista.innerHTML="<p style='text-align:center; color:#8fa3c6;'>Nenhum registro encontrado para este ciclo.</p>";
      destruirGraficos();
      return;
    }

    const periodos = Object.keys(base).sort();
    const periodoAtual = periodos[periodos.length-1];
    const registros = base[periodoAtual];

    lista.innerHTML = "";

    Object.keys(registros).sort((a,b)=>b-a).forEach(ts=>{ // Ordenado por mais recente
      const r = registros[ts];
      if(!r?.temp && !r?.temperatura) return;

      const tempVal = r.temp || r.temperatura;
      const humVal = r.hum || r.umidade;
      const fullDate = new Date(ts*1000).toLocaleString("pt-BR");
      const [data, hora] = fullDate.split(', ');

      dadosTela.push({data: fullDate, temp: tempVal, hum: humVal});

      lista.innerHTML += `
        <div class="item">
          <div class="data-group">
            <span class="time">${hora}</span>
            <span class="date">${data}</span>
          </div>
          <div class="val-group">
            <div class="val-unit">
              <label>Temperatura</label>
              <span>${tempVal}°C</span>
            </div>
            <div class="val-unit">
              <label>Umidade</label>
              <span style="color: #00ff88">${humVal}%</span>
            </div>
          </div>
        </div>`;
    });
    desenharGraficos(periodoAtual);
  });
}

function destruirGraficos(){
  if(chartTemp) chartTemp.destroy();
  if(chartHum) chartHum.destroy();
}

function desenharGraficos(periodo){
  destruirGraficos();
  Chart.defaults.color = '#8fa3c6';
  Chart.defaults.font.family = 'Inter';

  const config = (ctx, label, data, color) => new Chart(ctx, {
    type: 'line',
    data: {
      labels: dadosTela.map(d => d.data.split(', ')[1]).reverse(),
      datasets: [{
        label: label,
        data: data.reverse(),
        borderColor: color,
        backgroundGradient: true,
        backgroundColor: (context) => {
          const chart = context.chart;
          const {ctx, chartArea} = chart;
          if (!chartArea) return;
          const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
          gradient.addColorStop(0, 'transparent');
          gradient.addColorStop(1, color + '33');
          return gradient;
        },
        fill: true,
        tension: 0.4,
        borderWidth: 3,
        pointRadius: 0,
        pointHoverRadius: 6
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, border: { display: false } },
        x: { grid: { display: false }, border: { display: false } }
      }
    }
  });

  chartTemp = config(document.getElementById('graficoTemp'), 'Temp', dadosTela.map(d=>d.temp), '#00d2ff');
  chartHum = config(document.getElementById('graficoHum'), 'Umid', dadosTela.map(d=>d.hum), '#00ff88');
}

function exportarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p","mm","a4");
  const w = doc.internal.pageSize.getWidth();
  
  // Header Corporate
  doc.setFillColor(22, 27, 45);
  doc.rect(0, 0, w, 40, "F");
  
  doc.setTextColor(0, 210, 255);
  doc.setFontSize(22);
  doc.text("NewEnergy Solutions", 15, 18);
  
  doc.setTextColor(143, 163, 198);
  doc.setFontSize(10);
  doc.text("RELATÓRIO TÉCNICO DE MONITORAMENTO", 15, 25);
  doc.text(`GERADO EM: ${new Date().toLocaleString("pt-BR")}`, w-15, 25, {align: "right"});

  // Body
  doc.setTextColor(40);
  doc.setFontSize(14);
  doc.text(`Análise de Ciclo: ${abaAtual.toUpperCase()}`, 15, 55);

  doc.addImage(document.getElementById('graficoTemp'), "PNG", 15, 65, w-30, 50);
  doc.addImage(document.getElementById('graficoHum'), "PNG", 15, 120, w-30, 50);

  // Table header
  doc.setFillColor(245);
  doc.rect(15, 185, w-30, 8, "F");
  doc.setFontSize(9);
  doc.text("DATA E HORA", 20, 190);
  doc.text("TEMPERATURA", 80, 190);
  doc.text("UMIDADE RELATIVA", 140, 190);

  let py = 198;
  dadosTela.slice(0, 15).forEach(d => {
    doc.text(d.data, 20, py);
    doc.text(`${d.temp}°C`, 80, py);
    doc.text(`${d.hum}%`, 140, py);
    py += 6;
  });

  doc.save(`Relatorio_Executivo_${abaAtual}.pdf`);
}

carregarHistorico();
</script>
</body>
</html>
