<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy - Histórico</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
  background:#0b0f1b;
  color:#fff;
  display:flex;
  justify-content:center;
  padding:15px;
}
.card{
  background:#1b1f33;
  border-radius:15px;
  padding:20px;
  width:100%;
  max-width:720px;
  box-shadow:0 10px 25px rgba(0,0,0,.7);
}
h1{ text-align:center;color:#00bcd4;margin-bottom:10px }
.tabs{ display:flex;flex-wrap:wrap;margin-bottom:10px }
.tab{
  flex:1;
  padding:8px;
  text-align:center;
  background:#0c1424;
  margin:2px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}
.tab.active{ background:#00bcd4;color:#0b0f1b }

canvas{
  background:#fff;
  margin-bottom:10px;
  height:220px;
}

#lista{
  max-height:320px;
  overflow:auto;
  font-size:14px;
}

.item{
  background:#0c1424;
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
}
.data{ color:#8fa3c6 }
.valor{ color:#00bcd4;font-weight:bold }

.btn-container{ display:flex;gap:10px;margin-top:10px }
.btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff5722;
  color:#fff;
  cursor:pointer;
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
  <h1>Histórico de Leituras</h1>

  <div class="tabs">
    <div class="tab active" onclick="trocarAba('diario',this)">Diário</div>
    <div class="tab" onclick="trocarAba('semanal',this)">Semanal</div>
    <div class="tab" onclick="trocarAba('mensal',this)">Mensal</div>
    <div class="tab" onclick="trocarAba('anual',this)">Anual</div>
  </div>

  <canvas id="graficoTemp"></canvas>
  <canvas id="graficoHum"></canvas>

  <div id="lista"></div>

  <div class="btn-container">
    <button class="btn" onclick="exportarPDF()">Exportar PDF</button>
    <button class="btn" onclick="location.href='painel.html'">Voltar</button>
  </div>
</div>

<script>
/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey:"AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain:"oficial-688e8.firebaseapp.com",
  databaseURL:"https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId:"oficial-688e8"
});

const auth = firebase.auth();
const db   = firebase.database();

auth.onAuthStateChanged(u=>{
  if(!u) location.href="index.html";
});

/* ===== VARIÁVEIS ===== */
let abaAtual = "diario";
let chartTemp=null, chartHum=null;
let dadosTela = [];

/* ===== TROCAR ABA ===== */
function trocarAba(aba,el){
  abaAtual = aba;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  carregarHistorico();
}

/* ===== HISTÓRICO ===== */
function carregarHistorico(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "Carregando...";
  dadosTela = [];

  db.ref("/historico/"+abaAtual).once("value").then(snap=>{
    const base = snap.val();
    if(!base){
      lista.innerHTML="Nenhum dado encontrado.";
      destruirGraficos();
      return;
    }

    const periodos = Object.keys(base).sort();
    const periodoAtual = periodos[periodos.length-1];
    const registros = base[periodoAtual];

    lista.innerHTML = `<p><b>Período:</b> ${periodoAtual}</p>`;

    Object.keys(registros).sort((a,b)=>a-b).forEach(ts=>{
      const r = registros[ts];
      if(!r?.temperatura || !r?.umidade) return;

      const data = new Date(ts*1000).toLocaleString("pt-BR");
      dadosTela.push({data, temp:r.temperatura, hum:r.umidade});

      lista.innerHTML += `
        <div class="item">
          <div class="data">${data}</div>
          <div class="valor">Temp: ${r.temperatura} °C</div>
          <div class="valor">Umidade: ${r.umidade} %</div>
        </div>`;
    });

    desenharGraficos(periodoAtual);
  });
}

/* ===== GRÁFICOS ===== */
function destruirGraficos(){
  if(chartTemp) chartTemp.destroy();
  if(chartHum) chartHum.destroy();
}

function desenharGraficos(periodo){
  destruirGraficos();

  chartTemp = new Chart(graficoTemp,{
    type:"line",
    data:{
      labels:dadosTela.map(d=>d.data),
      datasets:[{
        label:`Temperatura (${periodo})`,
        data:dadosTela.map(d=>d.temp),
        borderColor:"#ff9800",
        backgroundColor:"rgba(255,152,0,.2)",
        fill:true
      }]
    }
  });

  chartHum = new Chart(graficoHum,{
    type:"line",
    data:{
      labels:dadosTela.map(d=>d.data),
      datasets:[{
        label:`Umidade (${periodo})`,
        data:dadosTela.map(d=>d.hum),
        borderColor:"#00bcd4",
        backgroundColor:"rgba(0,188,212,.2)",
        fill:true
      }]
    }
  });
}

/* ===== PDF PROFISSIONAL ===== */
function exportarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p","mm","a4");
  const largura = doc.internal.pageSize.getWidth();
  let y = 20;

  doc.setFillColor(240,240,240);
  doc.rect(0,0,largura,30,"F");

  doc.setFontSize(18);
  doc.setTextColor(0,80,120);
  doc.text("NewEnergy Solutions",14,18);

  doc.setFontSize(11);
  doc.setTextColor(0);
  doc.text("Relatório de Monitoramento Ambiental",largura-14,18,{align:"right"});

  y = 40;
  doc.setFontSize(12);
  doc.text(`Período: ${abaAtual.toUpperCase()}`,14,y);
  y+=7;
  doc.text(`Gerado em: ${new Date().toLocaleString("pt-BR")}`,14,y);
  y+=7;
  doc.text("Equipamento: Sensor Ambiental Wi-Fi – Alta Precisão",14,y);

  y+=10;
  doc.line(14,y,largura-14,y);
  y+=8;

  doc.text("Gráfico de Temperatura",14,y);
  y+=5;
  doc.addImage(graficoTemp,"PNG",14,y,largura-28,60);
  y+=70;

  doc.text("Gráfico de Umidade",14,y);
  y+=5;
  doc.addImage(graficoHum,"PNG",14,y,largura-28,60);

  doc.addPage();
  y=20;
  doc.setFontSize(14);
  doc.text("Registros Detalhados",14,y);
  y+=8;

  doc.setFontSize(10);
  dadosTela.forEach(d=>{
    if(y>280){ doc.addPage(); y=20; }
    doc.text(`${d.data}  |  Temp: ${d.temp}°C  |  Umid: ${d.hum}%`,14,y);
    y+=7;
  });

  const total = doc.internal.getNumberOfPages();
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text("Documento automático • NewEnergy Solutions • Compatível ISO 9001",largura/2,292,{align:"center"});
  }

  doc.save(`Relatorio_NewEnergy_${abaAtual}.pdf`);
}

/* INIT */
carregarHistorico();
</script>
</body>
</html>
