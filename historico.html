<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy - Histórico</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0b0f1b;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 15px;
}
.card {
  background: #1b1f33;
  border-radius: 15px;
  padding: 20px;
  width: 100%;
  max-width: 650px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
}
h1 {
  text-align: center;
  color: #00bcd4;
  margin-bottom: 12px;
}
.tabs { display: flex; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  flex: 1;
  padding: 8px;
  text-align: center;
  cursor: pointer;
  border-radius: 10px 10px 0 0;
  background: #0c1424;
  margin-right: 2px;
  margin-bottom: 2px;
  font-size: 14px;
}
.tab.active { background: #00bcd4; color: #0b0f1b; }

#grafico-container { overflow-x: auto; margin-bottom: 12px; }
#grafico-temp, #grafico-hum { min-width: 500px; height: 220px; margin-bottom: 10px; background:#fff; }

#lista { overflow-y: auto; flex: 1; padding-right: 5px; font-size: 14px; max-height: 300px; }

.item {
  background: #0c1424;
  padding: 8px;
  border-radius: 10px;
  margin-bottom: 6px;
}
.data { color: #8fa3c6; margin-bottom: 2px; }
.valor { font-weight: bold; color: #00bcd4; }

.btn-container { display: flex; gap: 10px; margin-top: 8px; }
.btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: #ff5722;
  font-size: 14px;
  cursor: pointer;
  color: white;
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
  <h1>Histórico de Leituras</h1>

  <div class="tabs">
    <div class="tab active" onclick="showTab(event,'diario')">Diário</div>
    <div class="tab" onclick="showTab(event,'semanal')">Semanal</div>
    <div class="tab" onclick="showTab(event,'mensal')">Mensal</div>
    <div class="tab" onclick="showTab(event,'anual')">Anual</div>
  </div>

  <div id="grafico-container">
    <canvas id="grafico-temp"></canvas>
    <canvas id="grafico-hum"></canvas>
  </div>

  <div id="lista"></div>

  <div class="btn-container">
    <button class="btn" onclick="exportPDF()">Exportar PDF</button>
    <button class="btn" onclick="window.location.href='painel.html'">Voltar</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentTab = 'diario';
let chartTemp, chartHum;

function chaveAtual(tab){
  const now = new Date();

  if(tab === "diario") return now.toISOString().slice(0,10);
  if(tab === "mensal") return now.toISOString().slice(0,7);
  if(tab === "anual") return now.getFullYear().toString();

  if(tab === "semanal"){
    const firstDay = new Date(now.getFullYear(),0,1);
    const week = Math.ceil((((now - firstDay) / 86400000) + firstDay.getDay()+1)/7);
    return `${now.getFullYear()}-W${String(week).padStart(2,'0')}`;
  }
}

function showTab(e,tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  carregarHistorico();
}

function carregarHistorico(){
  const LISTA = document.getElementById("lista");
  LISTA.innerHTML = "<p>Carregando...</p>";

  const periodo = chaveAtual(currentTab);
  const REF = db.ref(`/historico/${currentTab}/${periodo}`);

  REF.once("value", snap=>{
    const dados = snap.val();
    if(!dados){
      LISTA.innerHTML="<p>Nenhum registro neste período.</p>";
      if(chartTemp) chartTemp.destroy();
      if(chartHum) chartHum.destroy();
      return;
    }

    LISTA.innerHTML="";
    const labels=[], tempData=[], humData=[];

    Object.keys(dados).sort((a,b)=>b-a).forEach(ts=>{
      const item = dados[ts];
      const date = new Date(ts*1000).toLocaleString("pt-BR");

      LISTA.innerHTML += `
        <div class="item">
          <div class="data">${date}</div>
          <div class="valor">Temp: ${item.temperatura} °C</div>
          <div class="valor">Umidade: ${item.umidade} %</div>
        </div>`;

      labels.push(date);
      tempData.push(item.temperatura);
      humData.push(item.umidade);
    });

    if(chartTemp) chartTemp.destroy();
    chartTemp = new Chart(grafico-temp,{
      type:'line',
      data:{ labels, datasets:[{label:'Temperatura (°C)',data:tempData,borderColor:'#ff9800',backgroundColor:'rgba(255,152,0,0.2)',fill:true}] }
    });

    if(chartHum) chartHum.destroy();
    chartHum = new Chart(grafico-hum,{
      type:'line',
      data:{ labels, datasets:[{label:'Umidade (%)',data:humData,borderColor:'#00bcd4',backgroundColor:'rgba(0,188,212,0.2)',fill:true}] }
    });
  });
}

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text(`NewEnergy - Histórico (${currentTab})`,20,20);
  doc.text(`Gerado em: ${new Date().toLocaleString("pt-BR")}`,20,30);
  doc.save(`historico_${currentTab}.pdf`);
}

carregarHistorico();
</script>
</body>
</html>
