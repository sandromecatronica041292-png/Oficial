<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy | Business Intelligence</title>

<style>
  :root {
    --bg-dark: #0b0f1b;
    --card-bg: #161b2d;
    --accent: #00d2ff;
    --accent-hover: #0099cc;
    --text-main: #ffffff;
    --text-muted: #8fa3c6;
    --danger: #ff5722;
    --glass: rgba(255, 255, 255, 0.03);
  }

  body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 850px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
  }

  header { text-align: center; margin-bottom: 30px; }
  h1 { font-weight: 700; letter-spacing: -1px; color: var(--accent); margin: 0; font-size: 28px; }
  .subtitle { color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }

  .tabs { display: flex; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px; margin-bottom: 25px; gap: 5px; }
  .tab { flex: 1; padding: 12px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.3s; color: var(--text-muted); }
  .tab.active { background: var(--accent); color: var(--bg-dark); box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3); }

  .canvas-wrapper { background: var(--glass); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
  canvas { max-height: 200px; width: 100% !important; background: #fff; border-radius: 8px; }

  #lista { max-height: 350px; overflow-y: auto; padding-right: 10px; margin-top: 20px; }
  #lista::-webkit-scrollbar { width: 6px; }
  #lista::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

  .item {
    background: var(--glass);
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid transparent;
    transition: 0.2s;
  }
  .item:hover { border-color: rgba(0, 210, 255, 0.3); background: rgba(255,255,255,0.05); }

  .data-group .time { font-weight: 600; font-size: 15px; display: block; }
  .data-group .date { font-size: 12px; color: var(--text-muted); }

  .val-group { display: flex; gap: 20px; }
  .val-unit { text-align: right; }
  .val-unit label { font-size: 10px; color: var(--text-muted); display: block; text-transform: uppercase; }
  .val-unit span { font-weight: 700; color: var(--accent); font-size: 16px; }

  .btn-container { display: flex; gap: 15px; margin-top: 30px; }
  .btn {
    flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
    transition: all 0.3s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: var(--accent); color: var(--bg-dark); }
  .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text-main); }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
  <header>
    <div class="subtitle">Data Intelligence</div>
    <h1>NewEnergy Solutions</h1>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="trocarAba('diario',this)">Diário</div>
    <div class="tab" onclick="trocarAba('semanal',this)">Semanal</div>
    <div class="tab" onclick="trocarAba('mensal',this)">Mensal</div>
    <div class="tab" onclick="trocarAba('anual',this)">Anual</div>
  </div>

  <div class="canvas-wrapper"><canvas id="graficoTemp"></canvas></div>
  <div class="canvas-wrapper"><canvas id="graficoHum"></canvas></div>

  <div id="lista"></div>

  <div class="btn-container">
    <button class="btn btn-primary" onclick="exportarPDF()">Exportar PDF Completo</button>
    <button class="btn btn-secondary" onclick="location.href='painel.html'">Voltar</button>
  </div>
</div>

<script>
/* ===== FIREBASE CONFIG ===== */
firebase.initializeApp({
  apiKey:"AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain:"oficial-688e8.firebaseapp.com",
  databaseURL:"https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId:"oficial-688e8"
});
const db = firebase.database();
const auth = firebase.auth();

let abaAtual = "diario";
let chartTemp=null, chartHum=null;
let dadosTela = [];

function trocarAba(aba,el){
  abaAtual = aba;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  carregarHistorico();
}

function carregarHistorico(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "<p style='text-align:center; color:#8fa3c6;'>Sincronizando dados...</p>";
  dadosTela = [];

  db.ref("/historico/"+abaAtual).once("value").then(snap=>{
    const base = snap.val();
    if(!base){
      lista.innerHTML="<p style='text-align:center;'>Nenhum dado encontrado.</p>";
      destruirGraficos();
      return;
    }

    lista.innerHTML = "";
    const datasPastas = Object.keys(base).sort().reverse();

    datasPastas.forEach(dataPasta => {
      const registros = base[dataPasta];
      const timestamps = Object.keys(registros).sort().reverse();

      timestamps.forEach(ts => {
        const r = registros[ts];
        const tVal = r.temp || r.temperatura || 0;
        const hVal = r.hum || r.umidade || 0;
        const fullDate = new Date(ts * 1000).toLocaleString("pt-BR");
        const [data, hora] = fullDate.split(', ');

        dadosTela.push({data: fullDate, temp: tVal, hum: hVal});

        lista.innerHTML += `
          <div class="item">
            <div class="data-group">
              <span class="time">${hora}</span>
              <span class="date">${data}</span>
            </div>
            <div class="val-group">
              <div class="val-unit"><label>Temperatura</label><span>${tVal}°C</span></div>
              <div class="val-unit"><label>Umidade</label><span style="color:#00ff88">${hVal}%</span></div>
            </div>
          </div>`;
      });
    });
    desenharGraficos();
  });
}

function destruirGraficos(){
  if(chartTemp) chartTemp.destroy();
  if(chartHum) chartHum.destroy();
}

function desenharGraficos(){
  destruirGraficos();
  const labels = dadosTela.map(d => d.data.split(', ')[1]).reverse();
  const tData = dadosTela.map(d => d.temp).reverse();
  const hData = dadosTela.map(d => d.hum).reverse();

  const config = (ctx, label, data, color) => new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: label, data: data, borderColor: color,
        backgroundColor: color + '22', fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0
      }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { display: false } } }
  });

  chartTemp = config(document.getElementById('graficoTemp'), 'Temp', tData, '#00d2ff');
  chartHum = config(document.getElementById('graficoHum'), 'Umid', hData, '#00ff88');
}

function exportarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p", "mm", "a4");
  const w = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  
  // Cabeçalho Página 1
  doc.setFillColor(22, 27, 45);
  doc.rect(0, 0, w, 40, "F");
  doc.setTextColor(0, 210, 255);
  doc.setFontSize(22);
  doc.text("NewEnergy Solutions", 15, 18);
  doc.setTextColor(143, 163, 198);
  doc.setFontSize(10);
  doc.text("RELATÓRIO TÉCNICO DE MONITORAMENTO", 15, 25);
  doc.text(`GERADO EM: ${new Date().toLocaleString()}`, w - 15, 25, { align: "right" });

  doc.setTextColor(40);
  doc.setFontSize(14);
  doc.text(`Análise de Ciclo: ${abaAtual.toUpperCase()}`, 15, 50);

  // Gráficos
  doc.addImage(document.getElementById('graficoTemp'), "PNG", 15, 55, w - 30, 45);
  doc.addImage(document.getElementById('graficoHum'), "PNG", 15, 105, w - 30, 45);

  // Tabela
  doc.setFillColor(245, 245, 245);
  doc.rect(15, 160, w - 30, 8, "F");
  doc.setFontSize(9);
  doc.text("DATA E HORA", 20, 165);
  doc.text("TEMPERATURA", 85, 165);
  doc.text("UMIDADE RELATIVA", 145, 165);

  let py = 173;
  dadosTela.forEach((d) => {
    if (py > 280) {
      doc.addPage();
      doc.setFillColor(245, 245, 245);
      doc.rect(15, 20, w - 30, 8, "F");
      doc.text("DATA E HORA", 20, 25);
      doc.text("TEMPERATURA", 85, 25);
      doc.text("UMIDADE RELATIVA", 145, 25);
      py = 33;
    }
    doc.setTextColor(80);
    doc.text(d.data, 20, py);
    doc.text(`${d.temp}°C`, 85, py);
    doc.text(`${d.hum}%`, 145, py);
    doc.line(15, py + 2, w - 15, py + 2);
    py += 7;
  });

  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.text(`Página ${i} de ${totalPages}`, w / 2, pageHeight - 10, { align: "center" });
  }

  doc.save(`Relatorio_NewEnergy_${abaAtual}.pdf`);
}

auth.onAuthStateChanged(u => { if(u) carregarHistorico(); else location.href="index.html"; });
</script>
</body>
</html>
