<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy - Histórico</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
  background:#0b0f1b;
  color:#fff;
  display:flex;
  justify-content:center;
  padding:15px;
}
.card{
  background:#1b1f33;
  border-radius:15px;
  padding:20px;
  width:100%;
  max-width:700px;
  box-shadow:0 10px 25px rgba(0,0,0,.7);
}
h1{ text-align:center;color:#00bcd4;margin-bottom:10px }

.tabs{ display:flex;flex-wrap:wrap;margin-bottom:10px }
.tab{
  flex:1;
  padding:8px;
  text-align:center;
  background:#0c1424;
  margin:2px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}
.tab.active{ background:#00bcd4;color:#0b0f1b }

#grafico-temp,#grafico-hum{
  background:#fff;
  margin-bottom:10px;
  height:220px;
}

#lista{ max-height:320px;overflow:auto;font-size:14px }

.grupo{
  margin-bottom:16px;
}
.grupo-titulo{
  font-weight:bold;
  color:#ff9800;
  margin:10px 0 6px;
  font-size:15px;
  border-bottom:1px solid rgba(255,255,255,.2);
  padding-bottom:4px;
}

.item{
  background:#0c1424;
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
}
.data{ color:#8fa3c6 }
.valor{ color:#00bcd4;font-weight:bold }

.btn-container{ display:flex;gap:10px;margin-top:10px }
.btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff5722;
  color:#fff;
  cursor:pointer;
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
  <h1>Histórico de Leituras</h1>

  <div class="tabs">
    <div class="tab active" onclick="showTab('diario',this)">Diário</div>
    <div class="tab" onclick="showTab('semanal',this)">Semanal</div>
    <div class="tab" onclick="showTab('mensal',this)">Mensal</div>
    <div class="tab" onclick="showTab('anual',this)">Anual</div>
  </div>

  <canvas id="grafico-temp"></canvas>
  <canvas id="grafico-hum"></canvas>

  <div id="lista"></div>

  <div class="btn-container">
    <button class="btn" onclick="exportPDF()">Exportar PDF</button>
    <button class="btn" onclick="window.location.href='painel.html'">Voltar</button>
  </div>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain:"oficial-688e8.firebaseapp.com",
  databaseURL:"https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId:"oficial-688e8"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

auth.onAuthStateChanged(u=>{
  if(!u) location.href="index.html";
});

let currentTab="diario";
let chartTemp=null;
let chartHum=null;

function showTab(tab,el){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  carregarHistorico();
}

function formatarPeriodo(p){
  if(currentTab==="diario") return "Dia: "+p;
  if(currentTab==="semanal") return "Semana: "+p.replace("-W"," / Semana ");
  if(currentTab==="mensal") return "Mês: "+p;
  if(currentTab==="anual") return "Ano: "+p;
  return p;
}

function carregarHistorico(){
  const LISTA=document.getElementById("lista");
  LISTA.innerHTML="Carregando...";

  db.ref("/historico/"+currentTab).once("value").then(snap=>{
    const dados=snap.val();
    LISTA.innerHTML="";

    if(!dados){
      LISTA.innerHTML="Nenhum registro encontrado.";
      return;
    }

    const labels=[],temps=[],hums=[];

    Object.keys(dados).sort().reverse().forEach(periodo=>{
      const registros=dados[periodo];
      if(typeof registros!=="object") return;

      LISTA.innerHTML+=`
        <div class="grupo">
          <div class="grupo-titulo">${formatarPeriodo(periodo)}</div>
        </div>
      `;

      const grupo=LISTA.lastElementChild;
      Object.keys(registros).sort((a,b)=>b-a).forEach(ts=>{
        const r=registros[ts];
        if(!r) return;

        const data=new Date(ts*1000).toLocaleString("pt-BR");

        grupo.innerHTML+=`
          <div class="item">
            <div class="data">${data}</div>
            <div class="valor">Temp: ${r.temperatura} °C</div>
            <div class="valor">Umidade: ${r.umidade} %</div>
          </div>
        `;

        labels.push(data);
        temps.push(Number(r.temperatura));
        hums.push(Number(r.umidade));
      });
    });

    if(chartTemp) chartTemp.destroy();
    if(chartHum) chartHum.destroy();

    chartTemp=new Chart(document.getElementById("grafico-temp"),{
      type:"line",
      data:{labels,datasets:[{
        label:"Temperatura (°C)",
        data:temps,
        borderColor:"#ff9800",
        backgroundColor:"rgba(255,152,0,.2)",
        fill:true
      }]}
    });

    chartHum=new Chart(document.getElementById("grafico-hum"),{
      type:"line",
      data:{labels,datasets:[{
        label:"Umidade (%)",
        data:hums,
        borderColor:"#00bcd4",
        backgroundColor:"rgba(0,188,212,.2)",
        fill:true
      }]}
    });
  });
}

function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.setFontSize(16);
  doc.text("NewEnergy - Relatório de Monitoramento",14,15);
  doc.setFontSize(11);
  doc.text(`Período: ${currentTab.toUpperCase()}`,14,25);
  doc.text(`Gerado em: ${new Date().toLocaleString("pt-BR")}`,14,32);

  doc.addImage(document.getElementById("grafico-temp"),"PNG",10,40,190,70);
  doc.addImage(document.getElementById("grafico-hum"),"PNG",10,115,190,70);

  doc.save(`NewEnergy_${currentTab}.pdf`);
}

carregarHistorico();
</script>
</body>
</html>
