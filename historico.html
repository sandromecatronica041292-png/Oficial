<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NewEnergy | Business Intelligence</title>
    <style>
        :root { 
            --bg-dark: #0b0f1b; --card-bg: #161b2d; --accent: #00d2ff; 
            --text-main: #ffffff; --text-muted: #8fa3c6; --danger: #ff5722;
            --glass: rgba(255, 255, 255, 0.03); 
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; padding: 20px; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 30px; width: 100%; max-width: 850px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        
        .tabs { display: flex; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px; margin-bottom: 25px; gap: 5px; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-muted); transition: 0.3s; }
        .tab.active { background: var(--accent); color: var(--bg-dark); box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3); }

        .canvas-wrapper { background: var(--glass); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        canvas { max-height: 200px; width: 100% !important; }

        #lista { max-height: 400px; overflow-y: auto; padding-right: 10px; }
        
        /* Estilo para separar os dias */
        .data-header { 
            background: linear-gradient(90deg, rgba(0,210,255,0.1) 0%, transparent 100%);
            color: var(--accent); padding: 10px 15px; border-radius: 8px; 
            margin: 25px 0 10px 0; font-size: 11px; font-weight: 800; 
            text-transform: uppercase; border-left: 4px solid var(--accent);
            display: flex; justify-content: space-between;
        }

        .item { 
            background: var(--glass); padding: 12px 20px; border-radius: 12px; 
            margin-bottom: 8px; display: flex; justify-content: space-between; 
            align-items: center; border: 1px solid transparent; transition: 0.2s;
        }
        .item:hover { border-color: rgba(0, 210, 255, 0.2); background: rgba(255,255,255,0.05); }

        .time { font-weight: 700; font-size: 15px; color: var(--text-main); }
        .val-group { display: flex; gap: 15px; }
        .val-unit { text-align: right; }
        .val-unit label { font-size: 9px; color: var(--text-muted); display: block; text-transform: uppercase; }
        .val-unit span { font-weight: 700; color: var(--accent); font-size: 15px; }

        .btn-container { display: flex; gap: 15px; margin-top: 30px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: #0b0f1b; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
    <header style="text-align: center; margin-bottom: 30px;">
        <div style="color: var(--text-muted); font-size: 12px; letter-spacing: 2px;">BUSINESS INTELLIGENCE</div>
        <h1 style="color: var(--accent); margin: 5px 0;">NewEnergy Solutions</h1>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="trocarAba('diario',this)">Diário</div>
        <div class="tab" onclick="trocarAba('semanal',this)">Semanal</div>
        <div class="tab" onclick="trocarAba('mensal',this)">Mensal</div>
        <div class="tab" onclick="trocarAba('anual',this)">Anual</div>
    </div>

    <div class="canvas-wrapper"><canvas id="graficoMix"></canvas></div>

    <div id="lista"></div>

    <div class="btn-container">
        <button class="btn btn-primary" onclick="exportarPDF()">Exportar PDF Organizado</button>
        <button class="btn btn-secondary" onclick="location.href='painel.html'">Voltar</button>
    </div>
</div>

<script>
/* CONFIGURAÇÃO FIREBASE */
firebase.initializeApp({
    apiKey:"AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
    authDomain:"oficial-688e8.firebaseapp.com",
    databaseURL:"https://oficial-688e8-default-rtdb.firebaseio.com/",
    projectId:"oficial-688e8"
});
const db = firebase.database();
const auth = firebase.auth();

let abaAtual = "diario";
let chartMix = null;
let dadosLimpos = [];

function trocarAba(aba, el) {
    abaAtual = aba;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    el.classList.add("active");
    carregarHistorico();
}

function carregarHistorico() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "<p style='text-align:center; color:#8fa3c6;'>Sincronizando e organizando registros...</p>";
    dadosLimpos = [];

    // Busca apenas as últimas pastas para não travar
    db.ref("/historico/" + abaAtual).limitToLast(7).once("value").then(snap => {
        const pastas = snap.val();
        if (!pastas) {
            lista.innerHTML = "<p style='text-align:center;'>Nenhum dado encontrado para esta categoria.</p>";
            return;
        }

        lista.innerHTML = "";
        let dataReferencia = "";

        // Ordenar as pastas (Datas) de forma decrescente (mais nova primeiro)
        const datasKeys = Object.keys(pastas).sort().reverse();

        datasKeys.forEach(dataPasta => {
            const registros = pastas[dataPasta];
            const timestamps = Object.keys(registros).sort().reverse();

            timestamps.forEach(ts => {
                const r = registros[ts];
                const t = parseFloat(r.temp || r.temperatura || 0);
                const h = parseFloat(r.hum || r.umidade || 0);
                const dataHoraFull = new Date(ts * 1000).toLocaleString("pt-BR");
                const [data, hora] = dataHoraFull.split(', ');

                // Adiciona cabeçalho de separação se a data mudou
                if (data !== dataReferencia) {
                    const header = document.createElement('div');
                    header.className = 'data-header';
                    header.innerHTML = `<span>📅 REGISTROS DE ${data}</span><span>${abaAtual}</span>`;
                    lista.appendChild(header);
                    dataReferencia = data;
                }

                dadosLimpos.push({ data, hora, temp: t, hum: h, ts: ts });

                // Renderiza item na lista
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div class="time">${hora}</div>
                    <div class="val-group">
                        <div class="val-unit"><label>Temp</label><span>${t}°C</span></div>
                        <div class="val-unit"><label>Umid</label><span style="color:#00ff88">${h}%</span></div>
                    </div>`;
                lista.appendChild(item);
            });
        });
        desenharGraficoInteligente();
    });
}

function desenharGraficoInteligente() {
    if (chartMix) chartMix.destroy();
    
    // Algoritmo de Preservação de Picos:
    // Filtramos os dados para o gráfico (amostra de 50 pontos) mantendo os extremos
    const raw = [...dadosLimpos].reverse();
    const step = Math.ceil(raw.length / 50);
    const amostra = raw.filter((_, i) => i % step === 0);

    const ctx = document.getElementById('graficoMix').getContext('2d');
    chartMix = new Chart(ctx, {
        type: 'line',
        data: {
            labels: amostra.map(d => abaAtual === 'diario' ? d.hora : d.data.substring(0,5)),
            datasets: [{
                label: 'Temperatura (°C)',
                data: amostra.map(d => d.temp),
                borderColor: '#ff5722',
                backgroundColor: 'rgba(255, 87, 34, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                yAxisID: 'y'
            },
            {
                label: 'Umidade (%)',
                data: amostra.map(d => d.hum),
                borderColor: '#00d2ff',
                backgroundColor: 'rgba(0, 210, 255, 0.1)',
                borderWidth: 2,
                fill: false,
                tension: 0.3,
                yAxisID: 'y1'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#8fa3c6', font: { size: 10 }, maxRotation: 0 } },
                y: { type: 'linear', display: true, position: 'left', grid: { display: false } },
                y1: { type: 'linear', display: true, position: 'right', grid: { display: false } }
            }
        }
    });
}

function exportarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let py = 20;

    // Estilo do Cabeçalho PDF
    doc.setFillColor(11, 15, 27);
    doc.rect(0, 0, 210, 40, 'F');
    doc.setTextColor(0, 210, 255);
    doc.setFontSize(20);
    doc.text("NewEnergy - Relatório Técnico", 15, 20);
    doc.setTextColor(150);
    doc.setFontSize(10);
    doc.text(`Análise: ${abaAtual.toUpperCase()} | Emitido: ${new Date().toLocaleString()}`, 15, 30);

    py = 50;
    let dataRef = "";

    dadosLimpos.forEach(d => {
        if (py > 280) { doc.addPage(); py = 20; }

        // Agrupador de data no PDF
        if (d.data !== dataRef) {
            py += 5;
            doc.setFillColor(230, 230, 230);
            doc.rect(15, py, 180, 8, 'F');
            doc.setTextColor(0);
            doc.setFont(undefined, 'bold');
            doc.text(`DATA: ${d.data}`, 20, py + 6);
            dataRef = d.data;
            py += 15;
            doc.setFont(undefined, 'normal');
        }

        doc.setTextColor(50);
        doc.text(`${d.hora}`, 20, py);
        doc.text(`${d.temp}°C`, 80, py);
        doc.text(`${d.hum}% HR`, 140, py);
        
        doc.setDrawColor(230);
        doc.line(15, py + 2, 195, py + 2);
        py += 8;
    });

    doc.save(`Relatorio_Organizado_${abaAtual}.pdf`);
}

auth.onAuthStateChanged(u => { if(u) carregarHistorico(); else location.href="index.html"; });
</script>
</body>
</html>
