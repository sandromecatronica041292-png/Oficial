<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewEnergy - Histórico</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, Tahoma, sans-serif;
  background:#0b0f1b;
  color:#fff;
  display:flex;
  justify-content:center;
  padding:15px;
}
.card{
  background:#1b1f33;
  border-radius:15px;
  padding:20px;
  width:100%;
  max-width:800px;
}
h1{ text-align:center; color:#00bcd4 }
.tabs{ display:flex; gap:5px; margin-bottom:10px }
.tab{
  flex:1;
  padding:8px;
  background:#0c1424;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
}
.tab.active{ background:#00bcd4; color:#000 }
canvas{ background:#fff; margin:10px 0 }
.item{
  background:#0c1424;
  padding:8px;
  border-radius:8px;
  margin-bottom:6px;
}
.data{ color:#8fa3c6 }
.valor{ color:#00bcd4; font-weight:bold }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="card">
  <h1>Histórico de Leituras</h1>

  <div class="tabs">
    <div class="tab active" onclick="trocar('diario',this)">Diário</div>
    <div class="tab" onclick="trocar('semanal',this)">Semanal</div>
    <div class="tab" onclick="trocar('mensal',this)">Mensal</div>
    <div class="tab" onclick="trocar('anual',this)">Anual</div>
  </div>

  <canvas id="grafTemp" height="200"></canvas>
  <canvas id="grafHum" height="200"></canvas>

  <div id="lista"></div>
</div>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey:"AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain:"oficial-688e8.firebaseapp.com",
  databaseURL:"https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId:"oficial-688e8"
});

firebase.auth().onAuthStateChanged(u=>{
  if(!u) location.href="index.html";
});

const db = firebase.database();
let tabAtual = "diario";
let chartT=null, chartH=null;

/* TROCA ABA */
function trocar(tab,el){
  tabAtual=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  carregar();
}

/* CARREGAR HISTÓRICO */
function carregar(){
  const lista=document.getElementById("lista");
  lista.innerHTML="Carregando...";

  db.ref("historico/"+tabAtual).once("value").then(snap=>{
    const dados=snap.val();
    lista.innerHTML="";

    if(!dados){
      lista.innerHTML="Nenhum dado encontrado.";
      destruirGraficos();
      return;
    }

    let labels=[], temps=[], hums=[];

    Object.keys(dados).sort().reverse().forEach(periodo=>{
      const bloco=dados[periodo];
      if(typeof bloco!=="object") return;

      Object.keys(bloco).sort().reverse().forEach(ts=>{
        const r=bloco[ts];
        if(r.temperatura==null || r.umidade==null) return;

        const data=new Date(ts*1000).toLocaleString("pt-BR");

        lista.innerHTML+=`
          <div class="item">
            <div class="data">${data}</div>
            <div class="valor">Temp: ${r.temperatura} °C</div>
            <div class="valor">Umidade: ${r.umidade} %</div>
          </div>
        `;

        labels.push(data);
        temps.push(Number(r.temperatura));
        hums.push(Number(r.umidade));
      });
    });

    if(labels.length===0){
      lista.innerHTML="Nenhum registro válido.";
      destruirGraficos();
      return;
    }

    desenharGraficos(labels,temps,hums);
  });
}

/* GRÁFICOS */
function desenharGraficos(labels,t,h){
  destruirGraficos();

  chartT=new Chart(document.getElementById("grafTemp"),{
    type:"line",
    data:{labels,datasets:[{
      label:"Temperatura (°C)",
      data:t,
      borderColor:"#ff9800",
      backgroundColor:"rgba(255,152,0,.2)",
      fill:true
    }]}
  });

  chartH=new Chart(document.getElementById("grafHum"),{
    type:"line",
    data:{labels,datasets:[{
      label:"Umidade (%)",
      data:h,
      borderColor:"#00bcd4",
      backgroundColor:"rgba(0,188,212,.2)",
      fill:true
    }]}
  });
}

function destruirGraficos(){
  if(chartT){ chartT.destroy(); chartT=null }
  if(chartH){ chartH.destroy(); chartH=null }
}

carregar();
</script>
</body>
</html>
