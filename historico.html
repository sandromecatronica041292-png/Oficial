<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentTab = 'diario';
let chartTemp = null;
let chartHum  = null;

function chaveAtual(tab){
  const now = new Date();

  if(tab === "diario") return now.toISOString().slice(0,10);
  if(tab === "mensal") return now.toISOString().slice(0,7);
  if(tab === "anual")  return now.getFullYear().toString();

  if(tab === "semanal"){
    const firstDay = new Date(now.getFullYear(),0,1);
    const week = Math.ceil((((now - firstDay) / 86400000) + firstDay.getDay()+1)/7);
    return `${now.getFullYear()}-W${String(week).padStart(2,'0')}`;
  }
}

function showTab(e,tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  carregarHistorico();
}

function carregarHistorico(){
  const LISTA = document.getElementById("lista");
  LISTA.innerHTML = "<p>Carregando...</p>";

  const periodo = chaveAtual(currentTab);
  const REF = db.ref(`/historico/${currentTab}/${periodo}`);

  REF.once("value").then(snap=>{
    const dados = snap.val();

    if(!dados){
      LISTA.innerHTML="<p>Nenhum registro neste período.</p>";
      if(chartTemp) chartTemp.destroy();
      if(chartHum) chartHum.destroy();
      return;
    }

    LISTA.innerHTML="";
    const labels=[], tempData=[], humData=[];

    Object.keys(dados).sort((a,b)=>b-a).forEach(ts=>{
      const item = dados[ts];
      const date = new Date(ts*1000).toLocaleString("pt-BR");

      LISTA.innerHTML += `
        <div class="item">
          <div class="data">${date}</div>
          <div class="valor">Temp: ${item.temperatura} °C</div>
          <div class="valor">Umidade: ${item.umidade} %</div>
        </div>`;

      labels.unshift(date);
      tempData.unshift(item.temperatura);
      humData.unshift(item.umidade);
    });

    const ctxT = document.getElementById("grafico-temp").getContext("2d");
    if(chartTemp) chartTemp.destroy();
    chartTemp = new Chart(ctxT,{
      type:'line',
      data:{
        labels:labels,
        datasets:[{
          label:'Temperatura (°C)',
          data:tempData,
          borderColor:'#ff9800',
          backgroundColor:'rgba(255,152,0,0.2)',
          fill:true
        }]
      }
    });

    const ctxH = document.getElementById("grafico-hum").getContext("2d");
    if(chartHum) chartHum.destroy();
    chartHum = new Chart(ctxH,{
      type:'line',
      data:{
        labels:labels,
        datasets:[{
          label:'Umidade (%)',
          data:humData,
          borderColor:'#00bcd4',
          backgroundColor:'rgba(0,188,212,0.2)',
          fill:true
        }]
      }
    });
  });
}

// inicial
carregarHistorico();
</script>
