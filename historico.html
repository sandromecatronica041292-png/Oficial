<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy - Histórico</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
  background:#0b0f1b;
  color:#fff;
  display:flex;
  justify-content:center;
  padding:15px;
}
.card{
  background:#1b1f33;
  border-radius:15px;
  padding:20px;
  width:100%;
  max-width:720px;
  box-shadow:0 10px 25px rgba(0,0,0,.7);
}
h1{ text-align:center;color:#00bcd4;margin-bottom:10px }
.tabs{ display:flex;flex-wrap:wrap;margin-bottom:10px }
.tab{
  flex:1;
  padding:8px;
  text-align:center;
  background:#0c1424;
  margin:2px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}
.tab.active{ background:#00bcd4;color:#0b0f1b }

canvas{
  background:#fff;
  margin-bottom:10px;
  height:220px;
}

#lista{
  max-height:320px;
  overflow:auto;
  font-size:14px;
}

.item{
  background:#0c1424;
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
}
.data{ color:#8fa3c6 }
.valor{ color:#00bcd4;font-weight:bold }

.btn-container{ display:flex;gap:10px;margin-top:10px }
.btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff5722;
  color:#fff;
  cursor:pointer;
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
  <h1>Histórico de Leituras</h1>

  <div class="tabs">
    <div class="tab active" onclick="trocarAba('diario',this)">Diário</div>
    <div class="tab" onclick="trocarAba('semanal',this)">Semanal</div>
    <div class="tab" onclick="trocarAba('mensal',this)">Mensal</div>
    <div class="tab" onclick="trocarAba('anual',this)">Anual</div>
  </div>

  <canvas id="graficoTemp"></canvas>
  <canvas id="graficoHum"></canvas>

  <div id="lista"></div>

  <div class="btn-container">
    <button class="btn" onclick="exportarPDF()">Exportar PDF</button>
    <button class="btn" onclick="location.href='painel.html'">Voltar</button>
  </div>
</div>

<script>
/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey:"AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain:"oficial-688e8.firebaseapp.com",
  databaseURL:"https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId:"oficial-688e8"
});

const auth = firebase.auth();
const db   = firebase.database();

auth.onAuthStateChanged(u=>{
  if(!u) location.href="index.html";
});

/* ===== VARIÁVEIS ===== */
let abaAtual = "diario";
let chartTemp=null, chartHum=null;
let dadosTela = [];

/* ===== TROCA ABA ===== */
function trocarAba(aba,el){
  abaAtual = aba;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  carregarHistorico();
}

/* ===== CARREGAR HISTÓRICO ===== */
function carregarHistorico(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "Carregando...";
  dadosTela = [];

  db.ref("/historico/"+abaAtual).once("value").then(snap=>{
    const base = snap.val();
    if(!base){
      lista.innerHTML="Nenhum dado.";
      destruirGraficos();
      return;
    }

    // pega o período mais recente
    const periodos = Object.keys(base).sort();
    const periodo = periodos[periodos.length-1];
    const registros = base[periodo];

    lista.innerHTML = `<p><b>Período:</b> ${periodo}</p>`;

    Object.keys(registros).sort((a,b)=>a-b).forEach(ts=>{
      const r = registros[ts];
      if(!r?.temperatura || !r?.umidade) return;

      const data = new Date(ts*1000).toLocaleString("pt-BR");
      dadosTela.push({data, temp:r.temperatura, hum:r.umidade});

      lista.innerHTML += `
        <div class="item">
          <div class="data">${data}</div>
          <div class="valor">Temp: ${r.temperatura} °C</div>
          <div class="valor">Umidade: ${r.umidade} %</div>
        </div>`;
    });

    desenharGraficos(periodo);
  });
}

/* ===== GRÁFICOS ===== */
function destruirGraficos(){
  if(chartTemp) chartTemp.destroy();
  if(chartHum) chartHum.destroy();
}

function desenharGraficos(periodo){
  destruirGraficos();

  const labels = dadosTela.map(d=>d.data);
  const temps  = dadosTela.map(d=>Number(d.temp));
  const hums   = dadosTela.map(d=>Number(d.hum));

  chartTemp = new Chart(document.getElementById("graficoTemp"),{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:`Temperatura (${periodo})`,
        data:temps,
        borderColor:"#ff9800",
        backgroundColor:"rgba(255,152,0,.2)",
        fill:true
      }]
    }
  });

  chartHum = new Chart(document.getElementById("graficoHum"),{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:`Umidade (${periodo})`,
        data:hums,
        borderColor:"#00bcd4",
        backgroundColor:"rgba(0,188,212,.2)",
        fill:true
      }]
    }
  });
}

/* ===== PDF ===== */
function exportarPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.setFontSize(16);
  doc.text("NewEnergy - Relatório",14,15);
  doc.setFontSize(11);
  doc.text(`Período: ${abaAtual.toUpperCase()}`,14,25);
  doc.text(`Gerado: ${new Date().toLocaleString("pt-BR")}`,14,32);

  doc.addImage(document.getElementById("graficoTemp"),"PNG",10,40,190,65);
  doc.addImage(document.getElementById("graficoHum"),"PNG",10,110,190,65);

  let y=185;
  dadosTela.forEach(d=>{
    doc.text(`${d.data} | T:${d.temp}°C | U:${d.hum}%`,14,y);
    y+=7;
    if(y>280){ doc.addPage(); y=20; }
  });

  doc.save(`NewEnergy_${abaAtual}.pdf`);
}

/* INIT */
carregarHistorico();
</script>
</body>
</html>
