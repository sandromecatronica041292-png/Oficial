<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NewEnergy - Histórico Oficial</title>

    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0b0f1b; color: #fff; display: flex; justify-content: center; padding: 15px; }
        .card { background: #1b1f33; border-radius: 15px; padding: 20px; width: 100%; max-width: 650px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); }
        h1 { text-align: center; color: #00bcd4; margin-bottom: 20px; font-size: 22px; }
        
        .tabs { display: flex; margin-bottom: 15px; gap: 5px; overflow-x: auto; }
        .tab { flex: 1; min-width: 80px; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; background: #0c1424; font-size: 13px; transition: 0.3s; }
        .tab.active { background: #00bcd4; color: #0b0f1b; font-weight: bold; }
        
        #grafico-container { background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 15px; }
        canvas { max-height: 180px; margin-bottom: 10px; }
        
        #lista { overflow-y: auto; max-height: 280px; padding-right: 5px; }
        .item { background: #0c1424; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #00bcd4; display: flex; justify-content: space-between; align-items: center; }
        .data-info { display: flex; flex-direction: column; }
        .data-texto { color: #8fa3c6; font-size: 11px; }
        .valores-info { text-align: right; }
        .v-temp { color: #ff9800; font-weight: bold; }
        .v-hum { color: #00bcd4; font-weight: bold; }
        
        .btn-container { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #ff5722; color: white; cursor: pointer; font-weight: bold; }
        .btn-voltar { background: #444; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="card">
    <h1>Histórico de Leituras</h1>

    <div class="tabs">
        <div id="tab-diario" class="tab active" onclick="showTab('diario')">Diário</div>
        <div id="tab-semanal" class="tab" onclick="showTab('semanal')">Semanal</div>
        <div id="tab-mensal" class="tab" onclick="showTab('mensal')">Mensal</div>
        <div id="tab-anual" class="tab" onclick="showTab('anual')">Anual</div>
    </div>

    <div id="grafico-container">
        <canvas id="chartTemp"></canvas>
        <canvas id="chartHum"></canvas>
    </div>

    <div id="lista"></div>

    <div class="btn-container">
        <button class="btn btn-voltar" onclick="window.history.back()">Voltar</button>
    </div>
</div>

<script>
    // Configuração idêntica ao seu banco
    const firebaseConfig = {
        databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
        projectId: "oficial-688e8",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let chartT, chartH;

    function showTab(tab) {
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        carregarDados(tab);
    }

    function carregarDados(periodo) {
        const LISTA = document.getElementById("lista");
        LISTA.innerHTML = "<p style='text-align:center'>Carregando dados de 2026...</p>";
        
        // Acessa historico/diario, historico/mensal, etc.
        const ref = db.ref("historico/" + periodo);

        ref.on("value", snapshot => {
            const dadosRaiz = snapshot.val();
            if (!dadosRaiz) {
                LISTA.innerHTML = "<p style='text-align:center'>Nenhum dado encontrado para " + periodo + ".</p>";
                limparGraficos();
                return;
            }

            const labels = [];
            const tempArr = [];
            const humArr = [];
            let htmlItems = "";

            // 1. Pega as pastas de data (ex: 2026-02-05 ou 2026)
            const pastasDatas = Object.keys(dadosRaiz).sort().reverse();

            pastasDatas.forEach(dataKey => {
                const registros = dadosRaiz[dataKey];
                
                // 2. Pega os timestamps dentro de cada pasta
                const timestamps = Object.keys(registros).sort().reverse();

                timestamps.forEach(ts => {
                    const item = registros[ts];
                    
                    // Mapeamento para suas chaves: 'temp' e 'hum'
                    const t = item.temp || 0;
                    const h = item.hum || 0;
                    const dataObj = new Date(parseInt(ts) * 1000);
                    const dataHoraStr = dataObj.toLocaleString("pt-BR");

                    // Adicionar na lista (Mais recentes primeiro)
                    htmlItems += `
                        <div class="item">
                            <div class="data-info">
                                <span class="data-texto">${dataHoraStr}</span>
                                <span style="font-size:9px; color:#555">Ref: ${dataKey}</span>
                            </div>
                            <div class="valores-info">
                                <span class="v-temp">${t}°C</span> | 
                                <span class="v-hum">${h}%</span>
                            </div>
                        </div>`;

                    // Dados para os gráficos (Usamos unshift para a ordem ser da esquerda para a direita)
                    labels.unshift(dataHoraStr.split(' ')[1]); // Apenas a hora no eixo X
                    tempArr.unshift(t);
                    humArr.unshift(h);
                });
            });

            LISTA.innerHTML = htmlItems;
            atualizarGraficos(labels, tempArr, humArr);
        });
    }

    function atualizarGraficos(labels, temps, hums) {
        const ctxT = document.getElementById('chartTemp').getContext('2d');
        const ctxH = document.getElementById('chartHum').getContext('2d');

        if (chartT) chartT.destroy();
        if (chartH) chartH.destroy();

        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            scales: { 
                x: { ticks: { color: '#666', font: { size: 9 } } },
                y: { ticks: { color: '#666' } }
            },
            plugins: { legend: { labels: { color: '#333', font: { size: 11 } } } }
        };

        chartT = new Chart(ctxT, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{ label: 'Temperatura °C', data: temps, borderColor: '#ff9800', backgroundColor: 'rgba(255,152,0,0.1)', fill: true, tension: 0.3, pointRadius: 2 }]
            },
            options: commonOptions
        });

        chartH = new Chart(ctxH, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{ label: 'Umidade %', data: hums, borderColor: '#00bcd4', backgroundColor: 'rgba(0,188,212,0.1)', fill: true, tension: 0.3, pointRadius: 2 }]
            },
            options: commonOptions
        });
    }

    function limparGraficos() {
        if (chartT) chartT.destroy();
        if (chartH) chartH.destroy();
    }

    // Inicialização automática
    showTab('diario');
</script>
</body>
</html>
