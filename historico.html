<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewEnergy - Histórico</title>

<style>
body{
  margin:0;
  background:#0b0f1b;
  color:#fff;
  font-family:Segoe UI,Tahoma,Verdana;
  display:flex;
  justify-content:center;
  padding:15px;
}
.card{
  background:#1b1f33;
  width:100%;
  max-width:650px;
  border-radius:15px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.7);
}
h1{color:#00bcd4;text-align:center;margin-bottom:10px}
.tabs{display:flex;flex-wrap:wrap;margin-bottom:10px}
.tab{
  flex:1;
  text-align:center;
  padding:8px;
  background:#0c1424;
  border-radius:8px 8px 0 0;
  margin:2px;
  cursor:pointer;
}
.tab.active{background:#00bcd4;color:#000}
#grafico-container{margin-bottom:10px}
canvas{background:#fff;border-radius:10px;margin-bottom:10px}
#lista{max-height:300px;overflow:auto;font-size:14px}
.item{
  background:#0c1424;
  padding:8px;
  border-radius:8px;
  margin-bottom:6px;
}
.data{color:#8fa3c6}
.valor{color:#00bcd4;font-weight:bold}
.btn-container{display:flex;gap:10px;margin-top:10px}
.btn{
  flex:1;
  background:#ff5722;
  border:none;
  border-radius:10px;
  padding:10px;
  color:#fff;
  cursor:pointer;
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
<h1>Histórico de Leituras</h1>

<div class="tabs">
  <div class="tab active" onclick="setTab('diario',this)">Diário</div>
  <div class="tab" onclick="setTab('semanal',this)">Semanal</div>
  <div class="tab" onclick="setTab('mensal',this)">Mensal</div>
  <div class="tab" onclick="setTab('anual',this)">Anual</div>
</div>

<div id="grafico-container">
  <canvas id="graficoTemp"></canvas>
  <canvas id="graficoHum"></canvas>
</div>

<div id="lista"></div>

<div class="btn-container">
  <button class="btn" onclick="exportPDF()">Exportar PDF</button>
  <button class="btn" onclick="location.href='painel.html'">Voltar</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5FnkQiFi3gn9Iup2KNcbrKxWd-0Jjo6Y",
  authDomain: "oficial-688e8.firebaseapp.com",
  databaseURL: "https://oficial-688e8-default-rtdb.firebaseio.com/",
  projectId: "oficial-688e8",
  storageBucket: "oficial-688e8.firebasestorage.app",
  messagingSenderId: "547217835774",
  appId: "1:547217835774:web:c7186da5bf6156590c47af"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
firebase.auth().onAuthStateChanged(u=>{
  if(!u) location.href="index.html";
});

let periodo="diario";
let chartT, chartH;
let dadosPDF=[];

function setTab(p,el){
  periodo=p;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  carregar();
}

function carregar(){
  document.getElementById("lista").innerHTML="Carregando...";
  db.ref("historico").once("value").then(snap=>{
    const dados=snap.val();
    if(!dados){
      document.getElementById("lista").innerHTML="Sem dados";
      return;
    }

    const agora=new Date();
    const lista=[];
    Object.keys(dados).forEach(ts=>{
      const d=new Date(ts*1000);
      const dias=(agora-d)/86400000;
      if(
        periodo==="diario"&&dias<=1||
        periodo==="semanal"&&dias<=7||
        periodo==="mensal"&&dias<=30||
        periodo==="anual"&&dias<=365
      ){
        lista.push({data:d,...dados[ts]});
      }
    });

    lista.sort((a,b)=>b.data-a.data);
    render(lista);
  });
}

function render(lista){
  dadosPDF=lista;
  const div=document.getElementById("lista");
  div.innerHTML="";
  const labels=[],t=[],h=[];
  lista.forEach(l=>{
    const dt=l.data.toLocaleString("pt-BR");
    div.innerHTML+=`
      <div class="item">
        <div class="data">${dt}</div>
        <div class="valor">Temp: ${l.temperatura} °C</div>
        <div class="valor">Umidade: ${l.umidade} %</div>
      </div>`;
    labels.push(dt);t.push(l.temperatura);h.push(l.umidade);
  });

  if(chartT)chartT.destroy();
  if(chartH)chartH.destroy();

  chartT=new Chart(graficoTemp,{type:'line',
    data:{labels,datasets:[{label:'Temperatura (°C)',data:t,borderColor:'#ff9800',fill:true}]}
  });
  chartH=new Chart(graficoHum,{type:'line',
    data:{labels,datasets:[{label:'Umidade (%)',data:h,borderColor:'#00bcd4',fill:true}]}
  });
}

function exportPDF(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();
  pdf.setFontSize(16);
  pdf.text("NewEnergy Solutions",20,20);
  pdf.setFontSize(12);
  pdf.text(`Relatório ${periodo.toUpperCase()}`,20,35);
  pdf.text(`Gerado: ${new Date().toLocaleString("pt-BR")}`,20,45);

  let y=60;
  dadosPDF.forEach(d=>{
    pdf.text(
      `${d.data.toLocaleString("pt-BR")} | Temp:${d.temperatura}°C | Umid:${d.umidade}%`,
      20,y
    );
    y+=10;
    if(y>280){pdf.addPage();y=20;}
  });

  pdf.save(`relatorio_${periodo}.pdf`);
}

carregar();
</script>
</body>
</html>
